<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esports Battle Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #080808;
            --text: #f3f3f5;
            --muted: #888;
            --accent: #00ff87;
            --danger: #ff5b5b;
            --glass: rgba(255,255,255,0.05);
            --glass-strong: rgba(255,255,255,0.07);
            --line: rgba(255,255,255,0.08);
            --line-soft: rgba(255,255,255,0.05);
        }
        * { box-sizing: border-box; }
        html, body { background: var(--bg); margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            min-width: 1200px;
            font-feature-settings: 'cv11', 'ss01';
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; border: none; cursor: pointer; }

        /* Glass primitive */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            border-radius: 16px;
        }
        .accent { color: var(--accent); }
        .muted { color: var(--muted); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }

        /* Top nav */
        #topnav {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 32px;
            display: flex; align-items: center; gap: 24px;
            background: rgba(8,8,8,0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--line-soft);
        }
        .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; cursor: pointer; }
        .logo .accent { color: var(--accent); }
        .search-wrap { flex: 1; max-width: 520px; margin: 0 auto; position: relative; }
        .search-input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            font: 400 14px 'Inter', sans-serif;
        }
        .search-input:focus { outline: none; border-color: rgba(0,255,135,0.35); background: var(--glass-strong); }
        .search-input::placeholder { color: #555; }
        .search-dropdown {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0;
            background: rgba(18,18,20,0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--line);
            border-radius: 10px;
            max-height: 360px; overflow-y: auto;
            z-index: 200;
            display: none;
        }
        .search-dropdown.open { display: block; }
        .search-dropdown a {
            display: block; padding: 10px 16px; font-size: 14px;
            border-bottom: 1px solid var(--line-soft);
        }
        .search-dropdown a:last-child { border-bottom: 0; }
        .search-dropdown a:hover { background: rgba(0,255,135,0.08); color: var(--accent); }
        .search-dropdown .empty-row { padding: 14px 16px; color: var(--muted); font-size: 13px; font-style: italic; }
        .search-dropdown a mark { color: var(--accent); background: transparent; }

        .nav-links { display: flex; gap: 8px; align-items: center; }
        .btn {
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px; font-weight: 500;
        }
        .btn:hover { background: var(--glass-strong); border-color: rgba(255,255,255,0.14); }
        .btn.active { background: rgba(0,255,135,0.12); border-color: rgba(0,255,135,0.35); color: var(--accent); }

        /* Drawer */
        .drawer-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.15s;
        }
        .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
        .players-drawer {
            position: fixed; top: 0; right: 0;
            width: 340px; height: 100vh;
            background: rgba(14,14,16,0.96);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-left: 1px solid var(--line);
            z-index: 200;
            padding: 24px;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.2s ease;
        }
        .players-drawer.open { transform: translateX(0); }
        .players-drawer h3 {
            margin: 0 0 14px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--muted); font-weight: 600;
        }
        .players-drawer a {
            display: block; padding: 9px 12px; border-radius: 8px;
            font-size: 14px; transition: background 0.1s;
        }
        .players-drawer a:hover { background: rgba(0,255,135,0.1); color: var(--accent); }

        /* Main */
        main { max-width: 1400px; margin: 0 auto; padding: 32px; }
        section { margin-bottom: 40px; }
        .section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.6px;
            color: var(--muted); font-weight: 600; margin: 0 0 16px;
        }

        /* Stat cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-card { padding: 22px 24px; }
        .stat-card .label {
            font-size: 11px; color: var(--muted); text-transform: uppercase;
            letter-spacing: 1.4px; font-weight: 600; margin-bottom: 12px;
        }
        .stat-card .value { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; line-height: 1; }
        .stat-card .value.accent { color: var(--accent); }
        .stat-card .delta { font-size: 12px; color: var(--muted); margin-top: 8px; }

        /* Match cards */
        .match-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .match-card { padding: 16px 22px; transition: border-color 0.15s; }
        .match-card:hover { border-color: rgba(0,255,135,0.2); }
        .match-row {
            display: grid; grid-template-columns: 1fr auto 1fr;
            gap: 14px; align-items: center;
        }
        .match-card .player { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .match-card .player.right { text-align: right; align-items: flex-end; }
        .match-card .nick { font-weight: 600; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .match-card .nick a { color: var(--text); }
        .match-card .nick a:hover { color: var(--accent); }
        .match-card .team { font-size: 11px; color: var(--muted); }
        .match-card .score {
            font-size: 24px; font-weight: 700; min-width: 80px; text-align: center;
            font-variant-numeric: tabular-nums; letter-spacing: -0.5px;
        }
        .match-card .score.live { color: var(--danger); }
        .match-card .score.upcoming { font-size: 12px; color: #555; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
        .match-card .score.finished { color: var(--accent); }
        .match-card .meta {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid var(--line-soft);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--muted);
        }
        .match-card .pred {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--line-soft);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--muted);
        }
        .match-card .pred .conf { color: var(--accent); font-weight: 600; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
        .badge.live { background: rgba(255,91,91,0.15); color: var(--danger); border: 1px solid rgba(255,91,91,0.35); }
        .badge.upcoming { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--line); }
        .badge.finished { background: rgba(0,255,135,0.1); color: var(--accent); border: 1px solid rgba(0,255,135,0.3); }

        /* Tables */
        table.data { width: 100%; border-collapse: collapse; }
        table.data th, table.data td {
            padding: 12px 18px; text-align: left;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13px;
        }
        table.data th {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--muted); font-weight: 600; background: rgba(255,255,255,0.02);
        }
        table.data tbody tr:hover { background: rgba(255,255,255,0.02); }
        .table-wrap { overflow: hidden; }

        /* Player profile */
        .player-header { padding: 32px 36px; display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
        .player-header .name { font-size: 38px; font-weight: 700; letter-spacing: -1px; line-height: 1; margin-bottom: 18px; }
        .player-header .quick { display: flex; gap: 36px; flex-wrap: wrap; }
        .qs-item .v { font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .qs-item .v.accent { color: var(--accent); }
        .qs-item .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }

        .form-strip { display: flex; gap: 5px; align-items: center; }
        .form-dot {
            width: 30px; height: 30px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 11px;
        }
        .form-dot.W { background: rgba(0,255,135,0.16); color: var(--accent); border: 1px solid rgba(0,255,135,0.35); }
        .form-dot.D { background: rgba(255,255,255,0.06); color: #aaa; border: 1px solid var(--line); }
        .form-dot.L { background: rgba(255,91,91,0.14); color: var(--danger); border: 1px solid rgba(255,91,91,0.3); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

        .opp-card { padding: 20px; }
        .opp-card .nick { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .opp-card .sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; font-weight: 600; }
        .opp-card .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .opp-card .row .v { font-size: 18px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .opp-card .row .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }

        .h2h-result { padding: 28px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; }
        .h2h-result .col { text-align: center; }
        .h2h-result .nick { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
        .h2h-result .stat-big { font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -1px; }
        .h2h-result .stat-mid { font-size: 22px; font-weight: 700; line-height: 1; }
        .h2h-result .row { margin-top: 12px; }
        .h2h-result .row:first-child { margin-top: 0; }
        .h2h-result .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; font-weight: 600; }

        .chart-wrap { padding: 24px; height: 300px; position: relative; }
        .chart-wrap canvas { max-height: 252px; }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .controls input { padding: 9px 13px; min-width: 200px; }

        .filter-pills { display: flex; gap: 8px; }
        .pill {
            padding: 7px 16px;
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 12px; font-weight: 500;
        }
        .pill.active { background: var(--accent); color: #001a0e; border-color: var(--accent); font-weight: 700; }

        .check { color: var(--accent); font-weight: 700; }
        .cross { color: var(--danger); font-weight: 700; }
        .dim { color: #555; }

        .empty { padding: 40px; text-align: center; color: var(--muted); font-style: italic; font-size: 13px; }
        .loading { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

        .scroll-table { overflow: auto; max-height: 70vh; }
        .scroll-table table.data thead th { position: sticky; top: 0; background: rgba(15,15,17,0.95); }

        a.player-link { color: var(--text); border-bottom: 1px dotted transparent; transition: color 0.1s; }
        a.player-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

        .row-flex { display: flex; gap: 16px; align-items: center; }
        .right { margin-left: auto; }
        .small-btn { padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>
    <nav id="topnav">
        <a class="logo" href="#/">
            Esports Battle <span class="accent">Analytics</span>
        </a>
        <div class="search-wrap">
            <input id="search-input" class="search-input" type="text"
                   placeholder="Search player nickname…" autocomplete="off" spellcheck="false">
            <div id="search-dropdown" class="search-dropdown"></div>
        </div>
        <div class="nav-links">
            <a class="btn" href="#/predictions" id="nav-predictions">Predictions</a>
            <button class="btn" id="players-btn">Players</button>
        </div>
    </nav>

    <main id="app">
        <div class="loading">Loading…</div>
    </main>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="players-drawer" class="players-drawer">
        <h3>All Players</h3>
        <div id="players-list"></div>
    </aside>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://mdvocpljvyhcrthoqysm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kdm9jcGxqdnloY3J0aG9xeXNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTI0NDAsImV4cCI6MjA5MzMyODQ0MH0.1dv7H7Wh1yIgkwcLddCgvZgFASfOPm8DhGsgYbkeBdU";
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const REFRESH_MS = 5 * 60 * 1000;
        const STATUS = { UPCOMING: 1, LIVE: 2, FINISHED: 3 };

        const state = {
            players: [],
            playersByName: new Map(),
            playersById: new Map(),
            currentChart: null,
        };

        // ---------- utils ----------
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
            { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
        ));
        const fmtTime = (t) => new Date(t).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
        const fmtAgo = (t) => {
            const s = (Date.now() - new Date(t).getTime()) / 1000;
            if (s < 60) return Math.floor(s) + 's ago';
            if (s < 3600) return Math.floor(s/60) + 'm ago';
            if (s < 86400) return Math.floor(s/3600) + 'h ago';
            return Math.floor(s/86400) + 'd ago';
        };
        const playerLink = (id) => {
            const p = state.playersById.get(id);
            if (!p) return `<span class="dim">#${id}</span>`;
            return `<a class="player-link" href="#/player/${encodeURIComponent(p.nickname)}">${esc(p.nickname)}</a>`;
        };

        // ---------- routing ----------
        function getRoute() {
            const h = (location.hash || '#/').slice(1);
            const m = h.match(/^\/player\/(.+)$/);
            if (m) return { name: 'player', nickname: decodeURIComponent(m[1]) };
            if (h === '/predictions') return { name: 'predictions' };
            return { name: 'home' };
        }

        function updateNavActive() {
            const r = getRoute();
            const predLink = document.getElementById('nav-predictions');
            predLink.classList.toggle('active', r.name === 'predictions');
        }

        async function render() {
            updateNavActive();
            // Destroy any previous chart instance
            if (state.currentChart) {
                state.currentChart.destroy();
                state.currentChart = null;
            }
            const r = getRoute();
            const app = document.getElementById('app');
            app.innerHTML = '<div class="loading">Loading…</div>';
            try {
                if (r.name === 'home') await renderHome(app);
                else if (r.name === 'player') await renderPlayer(app, r.nickname);
                else if (r.name === 'predictions') await renderPredictions(app);
            } catch (err) {
                console.error(err);
                app.innerHTML = `<div class="empty">Failed to load: ${esc(err.message ?? err)}</div>`;
            }
        }

        window.addEventListener('hashchange', render);

        // ---------- data: bootstrap ----------
        async function loadAllPlayers() {
            const all = []; let from = 0; const PAGE = 1000;
            while (true) {
                const { data, error } = await sb.from('players')
                    .select('id, nickname, photo').range(from, from + PAGE - 1);
                if (error) throw error;
                all.push(...data);
                if (data.length < PAGE) break;
                from += PAGE;
            }
            return all;
        }

        // ---------- data: home ----------
        async function fetchTopStats() {
            const [{ count: matchCount }, { count: playerCount }] = await Promise.all([
                sb.from('matches').select('id', { head: true, count: 'exact' }),
                sb.from('players').select('id', { head: true, count: 'exact' }),
            ]);

            // Most active player
            const { data: topRow } = await sb.from('player_stats')
                .select('player_id, matches_played')
                .order('matches_played', { ascending: false })
                .limit(1);
            const topPlayer = topRow?.[0]
                ? { player: state.playersById.get(topRow[0].player_id), matches: topRow[0].matches_played }
                : null;

            // Predictions accuracy this week (evaluated_at within last 7d)
            const since = new Date(Date.now() - 7 * 86400 * 1000).toISOString();
            let predAcc = null;
            try {
                const { data: preds, error } = await sb.from('predictions')
                    .select('winner_correct')
                    .gte('evaluated_at', since)
                    .not('winner_correct', 'is', null);
                if (!error && preds?.length) {
                    const correct = preds.filter(p => p.winner_correct).length;
                    predAcc = { pct: Math.round(100 * correct / preds.length), n: preds.length };
                } else if (!error) {
                    predAcc = { pct: null, n: 0 };
                }
            } catch (e) { /* table may not exist yet */ }

            return { matchCount, playerCount, topPlayer, predAcc };
        }

        const MATCH_SELECT = `id, date, status, score1, score2, team1, team2, player1_id, player2_id`;

        async function fetchLive(limit = 12) {
            const { data, error } = await sb.from('matches')
                .select(MATCH_SELECT)
                .eq('status', STATUS.LIVE)
                .order('date', { ascending: true })
                .limit(limit);
            if (error) throw error;
            return data ?? [];
        }

        async function fetchUpcoming(limit = 20) {
            const { data, error } = await sb.from('matches')
                .select(MATCH_SELECT)
                .eq('status', STATUS.UPCOMING)
                .order('date', { ascending: true })
                .limit(limit);
            if (error) throw error;
            return data ?? [];
        }

        async function fetchPredictionsForMatchIds(matchIds) {
            if (!matchIds.length) return new Map();
            const { data, error } = await sb.from('predictions')
                .select('match_id, predicted_winner_id, predicted_score1, predicted_score2, confidence')
                .in('match_id', matchIds);
            if (error) return new Map(); // table may not exist yet
            return new Map((data ?? []).map(p => [p.match_id, p]));
        }

        async function fetchRecent(limit = 20) {
            const { data, error } = await sb.from('matches')
                .select(MATCH_SELECT)
                .eq('status', STATUS.FINISHED)
                .order('date', { ascending: false })
                .limit(limit);
            if (error) throw error;
            return data ?? [];
        }

        async function fetchTopPerformersWeek(limit = 5) {
            const since = new Date(Date.now() - 7 * 86400 * 1000).toISOString();
            const { data, error } = await sb.from('matches')
                .select('player1_id, player2_id, score1, score2')
                .eq('status', STATUS.FINISHED)
                .gte('date', since);
            if (error) throw error;
            const tally = new Map();
            for (const m of data ?? []) {
                const inc = (id) => tally.set(id, tally.get(id) || { id, w:0, d:0, l:0, gp:0 });
                inc(m.player1_id); inc(m.player2_id);
                const a = tally.get(m.player1_id); const b = tally.get(m.player2_id);
                a.gp += 1; b.gp += 1;
                if (m.score1 > m.score2) { a.w++; b.l++; }
                else if (m.score1 < m.score2) { a.l++; b.w++; }
                else { a.d++; b.d++; }
            }
            return [...tally.values()].sort((a, b) => b.w - a.w || b.gp - a.gp).slice(0, limit);
        }

        // ---------- renderers: home ----------
        function statCard(label, value, delta = '') {
            return `<div class="glass stat-card">
                <div class="label">${esc(label)}</div>
                <div class="value">${value}</div>
                ${delta ? `<div class="delta">${delta}</div>` : ''}
            </div>`;
        }

        function statusInfo(s) {
            if (s === STATUS.UPCOMING) return { cls: 'upcoming', label: 'Upcoming' };
            if (s === STATUS.LIVE) return { cls: 'live', label: 'Live' };
            if (s === STATUS.FINISHED) return { cls: 'finished', label: 'Finished' };
            return { cls: '', label: '—' };
        }

        function matchCard(m, prediction = null) {
            const st = statusInfo(m.status);
            const scoreCls = `score ${st.cls}`;
            const scoreText = m.status === STATUS.UPCOMING
                ? 'vs'
                : `${m.score1 ?? '–'} : ${m.score2 ?? '–'}`;
            let predHTML = '';
            if (prediction && m.status === STATUS.UPCOMING) {
                const winner = prediction.predicted_winner_id
                    ? playerLink(prediction.predicted_winner_id)
                    : '<span class="dim">draw</span>';
                predHTML = `<div class="pred">
                    <span>Predicted: ${winner} ${prediction.predicted_score1 ?? '?'}–${prediction.predicted_score2 ?? '?'}</span>
                    <span class="conf">${Number(prediction.confidence ?? 0).toFixed(0)}% conf</span>
                </div>`;

        // ---------- player profile ----------
        function findPlayerByNickname(nick) {
            return state.playersByName.get(nick.toLowerCase()) ?? null;
        }

        async function fetchPlayerStats(playerId) {
            const { data, error } = await sb.from('player_stats')
                .select('*').eq('player_id', playerId).limit(1);
            if (error) throw error;
            return data?.[0] ?? null;
        }

        async function fetchPlayerMatches(playerId, limit, offset = 0) {
            const { data, error } = await sb.from('matches')
                .select(MATCH_SELECT + ', tournament:tournaments!matches_tournament_id_fkey(name)')
                .eq('status', STATUS.FINISHED)
                .or(`player1_id.eq.${playerId},player2_id.eq.${playerId}`)
                .order('date', { ascending: false })
                .range(offset, offset + limit - 1);
            if (error) throw error;
            return data ?? [];
        }

        async function fetchPlayerH2HRows(playerId) {
            const { data, error } = await sb.from('h2h_stats')
                .select('*')
                .or(`player1_id.eq.${playerId},player2_id.eq.${playerId}`);
            if (error) throw error;
            return data ?? [];
        }

        async function fetchPlayerPredictionAccuracy(playerId) {
            try {
                const { data, error } = await sb.from('predictions')
                    .select('winner_correct, match:matches!predictions_match_id_fkey(player1_id, player2_id)')
                    .not('winner_correct', 'is', null);
                if (error) return null;
                const involved = (data ?? []).filter(p => p.match
                    && (p.match.player1_id === playerId || p.match.player2_id === playerId));
                if (!involved.length) return { pct: null, n: 0 };
                const correct = involved.filter(p => p.winner_correct).length;
                return { pct: Math.round(100 * correct / involved.length), n: involved.length };
            } catch (e) { return null; }
        }

        function resultOf(m, playerId) {
            const isP1 = m.player1_id === playerId;
            const own = isP1 ? m.score1 : m.score2;
            const opp = isP1 ? m.score2 : m.score1;
            if (own == null || opp == null) return null;
            return own > opp ? 'W' : own < opp ? 'L' : 'D';
        }

        function opponentSummary(h2hRows, playerId) {
            const opps = h2hRows.map(h => {
                const isP1 = h.player1_id === playerId;
                const oppId = isP1 ? h.player2_id : h.player1_id;
                return {
                    oppId,
                    matches_played: h.matches_played,
                    wins: isP1 ? h.wins_p1 : h.wins_p2,
                    losses: isP1 ? h.wins_p2 : h.wins_p1,
                    draws: h.draws,
                    avg_gf: Number(isP1 ? h.avg_gf_p1 : h.avg_gf_p2),
                    avg_ga: Number(isP1 ? h.avg_gf_p2 : h.avg_gf_p1),
                };
            });
            return opps;
        }

        async function renderPlayer(app, nickname) {
            const player = findPlayerByNickname(nickname);
            if (!player) {
                app.innerHTML = `<section class="glass empty">No tracked player named "${esc(nickname)}".</section>`;
                return;
            }
            const [ps, matches20, h2hRows, predAcc] = await Promise.all([
                fetchPlayerStats(player.id),
                fetchPlayerMatches(player.id, 20, 0),
                fetchPlayerH2HRows(player.id),
                fetchPlayerPredictionAccuracy(player.id),
            ]);

            const last10 = matches20.slice(0, 10);
            const formStr = last10.map(m => resultOf(m, player.id)).filter(Boolean).reverse();
            const winRate = ps?.matches_played ? Math.round(100 * ps.wins / ps.matches_played) : 0;
            const opps = opponentSummary(h2hRows, player.id).filter(o => o.matches_played >= 1);
            const best = [...opps].filter(o => o.matches_played >= 1)
                .sort((a, b) => (b.wins/b.matches_played) - (a.wins/a.matches_played) || b.matches_played - a.matches_played).slice(0, 3);
            const worst = [...opps].filter(o => o.matches_played >= 1)
                .sort((a, b) => (b.losses/b.matches_played) - (a.losses/a.matches_played) || b.matches_played - a.matches_played).slice(0, 3);

            const oppCard = (o, kind) => {
                const wr = o.matches_played ? Math.round(100 * o.wins / o.matches_played) : 0;

                return `<div class="glass opp-card">

                        <div><div class="v">${o.avg_ga.toFixed(1)}</div><div class="l">avg ga</div></div>

            app.innerHTML = `
                <section class="glass player-header">
                    <div>
                        <div class="name">${esc(player.nickname)}</div>
                        <div class="quick">
                            <div class="qs-item"><div class="v accent">${ps?.wins ?? 0}<span class="muted" style="font-weight:400"> · ${ps?.draws ?? 0} · ${ps?.losses ?? 0}</span></div><div class="l">W · D · L</div></div>
                            <div class="qs-item"><div class="v">${winRate}%</div><div class="l">win rate</div></div>
                            <div class="qs-item"><div class="v">${Number(ps?.avg_gf ?? 0).toFixed(2)}</div><div class="l">avg goals for</div></div>
                            <div class="qs-item"><div class="v">${Number(ps?.avg_ga ?? 0).toFixed(2)}</div><div class="l">avg goals against</div></div>
                            <div class="qs-item"><div class="v">${ps?.matches_played ?? 0}</div><div class="l">matches played</div></div>
                            <div class="qs-item"><div class="v">${predLabel}</div><div class="l">predictions accuracy</div></div>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Recent form · last 10</h2>
                    <div class="glass" style="padding:22px;">
                        ${formStr.length
                            ? `<div class="form-strip">${formStr.map(r => `<div class="form-dot ${r}">${r}</div>`).join('')}</div>`
                            : '<div class="muted">No finished matches.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Goal trend · last 20 finished</h2>
                    <div class="glass chart-wrap">
                        <canvas id="goal-chart"></canvas>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Best opponents</h2>
                    <div class="three-col">
                        ${best.length ? best.map(o => oppCard(o, 'best')).join('') : '<div class="glass empty" style="grid-column:1/-1">No head-to-head data yet.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Worst opponents</h2>
                    <div class="three-col">
                        ${worst.length ? worst.map(o => oppCard(o, 'worst')).join('') : '<div class="glass empty" style="grid-column:1/-1">No head-to-head data yet.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Recent matches</h2>
                    <div class="glass table-wrap">
                        <table class="data" id="matches-table">
                            <thead><tr><th>Date</th><th>Result</th><th>Opponent</th><th>Score</th><th>Tournament</th></tr></thead>
                            <tbody>${matches20.slice(0, 10).map(m => matchRow(m, player.id)).join('')}</tbody>
                        </table>
                        <div style="padding:14px 18px;border-top:1px solid var(--line-soft);text-align:center">
                            <button class="btn small-btn" id="load-more">Load more</button>

                    <div class="glass" style="padding:22px;">
                        <div class="controls">
                            <input id="h2h-input" class="search-input" style="max-width:240px" placeholder="Opponent nickname" autocomplete="off" spellcheck="false">
                            <button class="btn" id="h2h-go">Search</button>
                        </div>
                        <div id="h2h-output"><div class="empty" style="padding:20px">Enter an opponent nickname.</div></div>
                    </div>

            `;

            // Wire up "load more"
            let loaded = 10;
            const tbody = document.querySelector('#matches-table tbody');
            const loadMoreBtn = document.getElementById('load-more');
            loadMoreBtn.addEventListener('click', async () => {
                loadMoreBtn.disabled = true;
                loadMoreBtn.textContent = 'Loading…';
                const next = await fetchPlayerMatches(player.id, 10, loaded);
                if (!next.length) {
                    loadMoreBtn.textContent = 'No more';
                    return;
                }
                tbody.insertAdjacentHTML('beforeend', next.map(m => matchRow(m, player.id)).join(''));
                loaded += next.length;
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = 'Load more';
            });

            // Wire up h2h search
            const h2hInput = document.getElementById('h2h-input');
            const h2hGo = document.getElementById('h2h-go');
            const h2hOut = document.getElementById('h2h-output');
            const doH2H = async () => {
                const opp = findPlayerByNickname(h2hInput.value.trim());
                if (!opp) { h2hOut.innerHTML = '<div class="empty" style="padding:20px">Player not found.</div>'; return; }
                if (opp.id === player.id) { h2hOut.innerHTML = '<div class="empty" style="padding:20px">Pick a different player.</div>'; return; }
                const lo = Math.min(player.id, opp.id);
                const hi = Math.max(player.id, opp.id);
                const { data } = await sb.from('h2h_stats').select('*').eq('player1_id', lo).eq('player2_id', hi).limit(1);
                if (!data?.length) {
                    h2hOut.innerHTML = `<div class="empty" style="padding:20px">${esc(player.nickname)} and ${esc(opp.nickname)} have never played.</div>`;
                    return;

                const h = data[0];
                const aIsLo = player.id === lo;
                const aWins = aIsLo ? h.wins_p1 : h.wins_p2;
                const bWins = aIsLo ? h.wins_p2 : h.wins_p1;
                const aGF = Number(aIsLo ? h.avg_gf_p1 : h.avg_gf_p2);
                const bGF = Number(aIsLo ? h.avg_gf_p2 : h.avg_gf_p1);
                h2hOut.innerHTML = `

            // Render goal trend chart
            const chartData = [...matches20].reverse().map(m => {
                const isP1 = m.player1_id === player.id;
                return {
                    x: new Date(m.date),
                    y: (isP1 ? m.score1 : m.score2) ?? 0,

                type: 'line',

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15,15,17,0.95)', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 },
                    },
                    scales: {
                        x: { ticks: { color: '#666', maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { color: 'rgba(255,255,255,0.04)' } },
                        y: { ticks: { color: '#666' }, grid: { color: 'rgba(255,255,255,0.04)' }, beginAtZero: true },
                    },
                },
            });
        }

        function matchRow(m, playerId) {
            const result = resultOf(m, playerId);
            const isP1 = m.player1_id === playerId;
            const oppId = isP1 ? m.player2_id : m.player1_id;
            const own = isP1 ? m.score1 : m.score2;
            const opp = isP1 ? m.score2 : m.score1;
            const resultBadge = result === 'W' ? '<span class="badge" style="background:rgba(0,255,135,0.15);color:#00ff87">W</span>'
                : result === 'L' ? '<span class="badge" style="background:rgba(255,91,91,0.15);color:#ff5b5b">L</span>'
                : '<span class="badge" style="background:rgba(255,255,255,0.06);color:#aaa">D</span>';
            return `<tr>
                <td>${fmtTime(m.date)}</td>
                <td>${resultBadge}</td>
                <td>${playerLink(oppId)}</td>
                <td class="num">${own ?? '–'} : ${opp ?? '–'}</td>
                <td class="muted">${esc(m.tournament?.name ?? '')}</td>
            </tr>`;
        }

        // ---------- predictions page ----------
        async function fetchAllPredictions() {
            try {
                const { data, error } = await sb.from('predictions')
                    .select(`
                        id, predicted_winner_id, predicted_score1, predicted_score2, confidence,
                        winner_correct, score_correct, evaluated_at,
                        match:matches!predictions_match_id_fkey(id, date, status, score1, score2, player1_id, player2_id)
                    `)
                    .order('id', { ascending: false })
                    .limit(500);
                if (error) throw error;
                return data ?? [];
            } catch (e) { return null; }
        }

        async function renderPredictions(app) {
            const all = await fetchAllPredictions();
            if (all === null) {
                app.innerHTML = `<section class="glass empty">
                    The <code>predictions</code> table doesn't exist yet. Apply the migration in <code>sql/schema.sql</code> via the Supabase SQL Editor.
                </section>`;
                return;
            }
            const evaluated = all.filter(p => p.evaluated_at);
            const winnerCorrect = evaluated.filter(p => p.winner_correct).length;
            const scoreCorrect = evaluated.filter(p => p.score_correct).length;
            const winnerAcc = evaluated.length ? Math.round(100 * winnerCorrect / evaluated.length) : 0;
            const scoreAcc = evaluated.length ? Math.round(100 * scoreCorrect / evaluated.length) : 0;

            const renderWith = (filter) => {
                let rows = all;
                if (filter === 'pending') rows = all.filter(p => !p.evaluated_at);
                else if (filter === 'correct') rows = evaluated.filter(p => p.winner_correct);
                else if (filter === 'incorrect') rows = evaluated.filter(p => !p.winner_correct);
                return rows.map(predictionRow).join('') || '<tr><td colspan="9" class="empty">No predictions in this view.</td></tr>';
            };

            app.innerHTML = `
                <section>
                    <div class="stats-grid">
                        ${statCard('Total predictions', all.length)}
                        ${statCard('Evaluated', evaluated.length)}
                        ${statCard('Winner accuracy', `<span class="accent">${winnerAcc}%</span>`)}
                        ${statCard('Exact-score accuracy', `<span class="accent">${scoreAcc}%</span>`)}
                    </div>
                </section>

                <section>
                    <div class="filter-pills" id="pred-filters">
                        <button class="pill active" data-f="all">All</button>
                        <button class="pill" data-f="pending">Pending</button>
                        <button class="pill" data-f="correct">Correct</button>
                        <button class="pill" data-f="incorrect">Incorrect</button>
                    </div>
                    <div class="glass scroll-table">
                        <table class="data">
                            <thead>
                                <tr>
                                    <th>Match date</th>
                                    <th>Player 1</th>
                                    <th>Player 2</th>
                                    <th>Predicted winner</th>
                                    <th class="num">Confidence</th>
                                    <th class="num">Predicted</th>
                                    <th class="num">Actual</th>
                                    <th>Winner</th>
                                    <th>Score</th>
                                </tr>
                            </thead>
                            <tbody id="pred-tbody">${renderWith('all')}</tbody>
                        </table>
                    </div>
                </section>
            `;

            const pillsEl = document.getElementById('pred-filters');
            const tbody = document.getElementById('pred-tbody');
            pillsEl.addEventListener('click', (e) => {
                const btn = e.target.closest('.pill');
                if (!btn) return;
                pillsEl.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p === btn));
                tbody.innerHTML = renderWith(btn.dataset.f);
            });
        }

        function predictionRow(p) {
            if (!p.match) return '';
            const m = p.match;
            const date = fmtTime(m.date);
            const winnerName = p.predicted_winner_id
                ? playerLink(p.predicted_winner_id)
                : '<span class="dim">draw</span>';
            const actual = m.status === STATUS.FINISHED
                ? `${m.score1 ?? '–'}–${m.score2 ?? '–'}`
                : '<span class="dim">—</span>';
            const wIcon = p.evaluated_at
                ? (p.winner_correct ? '<span class="check">✓</span>' : '<span class="cross">✗</span>')
                : '<span class="dim">—</span>';
            const sIcon = p.evaluated_at
                ? (p.score_correct ? '<span class="check">✓</span>' : '<span class="cross">✗</span>')
                : '<span class="dim">—</span>';
            return `<tr>
                <td>${date}</td>
                <td>${playerLink(m.player1_id)}</td>
                <td>${playerLink(m.player2_id)}</td>
                <td>${winnerName}</td>
                <td class="num accent">${Number(p.confidence ?? 0).toFixed(0)}%</td>
                <td class="num">${p.predicted_score1 ?? '–'}–${p.predicted_score2 ?? '–'}</td>
                <td class="num">${actual}</td>
                <td>${wIcon}</td>
                <td>${sIcon}</td>
            </tr>`;
        }

        // ---------- search ----------
        function renderSearchResults(query) {
            const dropdown = document.getElementById('search-dropdown');
            const q = query.trim().toLowerCase();
            if (!q) { dropdown.classList.remove('open'); dropdown.innerHTML = ''; return; }
            const matches = state.players.filter(p =>
                p.nickname && p.nickname.toLowerCase().includes(q)
            ).slice(0, 10);
            if (!matches.length) {
                dropdown.innerHTML = '<div class="empty-row">No matching player.</div>';
            } else {
                dropdown.innerHTML = matches.map(p => {
                    const i = p.nickname.toLowerCase().indexOf(q);
                    const html = i >= 0
                        ? esc(p.nickname.slice(0, i)) + '<mark>' + esc(p.nickname.slice(i, i + q.length)) + '</mark>' + esc(p.nickname.slice(i + q.length))
                        : esc(p.nickname);
                    return `<a href="#/player/${encodeURIComponent(p.nickname)}">${html}</a>`;
                }).join('');
            }
            dropdown.classList.add('open');
        }

        function setupSearch() {
            const input = document.getElementById('search-input');
            const dropdown = document.getElementById('search-dropdown');
            input.addEventListener('input', e => renderSearchResults(e.target.value));
            input.addEventListener('focus', e => { if (e.target.value.trim()) renderSearchResults(e.target.value); });
            document.addEventListener('click', e => {
                if (!e.target.closest('.search-wrap')) dropdown.classList.remove('open');
            });
            dropdown.addEventListener('click', () => {
                input.value = '';
                dropdown.classList.remove('open');
            });
        }

        function setupDrawer() {
            const drawer = document.getElementById('players-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            const btn = document.getElementById('players-btn');
            const list = document.getElementById('players-list');
            list.innerHTML = state.players
                .map(p => `<a href="#/player/${encodeURIComponent(p.nickname)}">${esc(p.nickname)}</a>`)
                .join('');
            const open = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
            const close = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };
            btn.addEventListener('click', open);
            backdrop.addEventListener('click', close);
            drawer.addEventListener('click', e => { if (e.target.tagName === 'A') close(); });
        }

        // ---------- init ----------
        async function init() {
            try {
                state.players = (await loadAllPlayers())
                    .filter(p => p.nickname)
                    .sort((a, b) => a.nickname.localeCompare(b.nickname, undefined, { sensitivity: 'base' }));
                state.playersByName = new Map(state.players.map(p => [p.nickname.toLowerCase(), p]));
                state.playersById = new Map(state.players.map(p => [p.id, p]));
                setupSearch();
                setupDrawer();
                await render();
                setInterval(() => { render(); }, REFRESH_MS);
            } catch (err) {
                document.getElementById('app').innerHTML =
                    `<div class="empty">Failed to bootstrap: ${esc(err.message ?? err)}</div>`;
            }
        }
        init();
    </script>
</body>
</html>
