                </div>
                <div class="members">${coreIds.map(id => {
                    const p = state.playersById.get(id);
                    return p ? `<a class="player-link" href="#/player/${encodeURIComponent(p.nickname)}" onclick="event.stopPropagation()">${esc(p.nickname)}</a>` : '';
                }).join('')}</div>
                <table class="data mini-table">
                    <thead><tr><th>Player</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GD</th><th class="num">Pts</th></tr></thead>
                    <tbody>${table.map(r => `<tr>
                        <td>${playerLink(r.id)}</td>
                        <td class="num">${r.p}</td>
                        <td class="num">${r.w}</td>
                        <td class="num">${r.d}</td>
                        <td class="num">${r.l}</td>
                        <td class="num">${r.gd >= 0 ? '+' : ''}${r.gd}</td>
                        <td class="num accent">${r.pts}</td>
                    </tr>`).join('')}</tbody>
                </table>
            </a>`;
        }

        async function renderGroup(app, gid) {
            const g = state.groupsById.get(gid);
            if (!g) { app.innerHTML = `<section class="glass empty">Group not found.</section>`; return; }
            const allFinished = await fetchAllFinished();
            const coreIds = groupCoreIds(gid);
            const subIds = state.members.filter(m => m.group_id === gid && m.role === 'sub').map(m => m.player_id);
            const groupAll = groupAllIds(gid);
            const groupSet = new Set(coreIds);
            const groupMatches = allFinished.filter(m => groupSet.has(m.player1_id) && groupSet.has(m.player2_id));
            const table = leagueTableForPlayers(coreIds, allFinished);

            // Tournament history involving group members
            const tIds = new Set();
            for (const m of allFinished) {
                if (groupSet.has(m.player1_id) || groupSet.has(m.player2_id)) tIds.add(m.tournament_id);
            }
            const tourMeta = await fetchTournamentsByIds([...tIds]);
            const tournamentList = [...tIds]
                .map(tid => {
                    const ms = allFinished.filter(m => m.tournament_id === tid && (groupSet.has(m.player1_id) || groupSet.has(m.player2_id)));
                    return { tid, name: tourMeta.get(tid)?.name ?? `#${tid}`, date: ms[0]?.date, count: ms.length };
                })
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .slice(0, 20);

            // Rivalry tracker
            const pairs = new Map();
            for (const m of groupMatches) {
                const lo = Math.min(m.player1_id, m.player2_id);
                const hi = Math.max(m.player1_id, m.player2_id);
                const k = `${lo}:${hi}`;
                if (!pairs.has(k)) pairs.set(k, { lo, hi, matches: [], goals: 0, draws: 0, upsets: 0 });
                const ent = pairs.get(k);
                ent.matches.push(m);
                if (m.score1 != null && m.score2 != null) {
                    ent.goals += m.score1 + m.score2;
                    if (m.score1 === m.score2) ent.draws++;
                }
            }
            // Upsets: lower-Pts player wins. Compute Pts ranking from leagueTable.
            const ptsById = new Map(table.map(r => [r.id, r.pts]));
            for (const ent of pairs.values()) {
                for (const m of ent.matches) {
                    if (m.score1 == null || m.score2 == null || m.score1 === m.score2) continue;
                    const winner = m.score1 > m.score2 ? m.player1_id : m.player2_id;
                    const loser = winner === m.player1_id ? m.player2_id : m.player1_id;
                    if ((ptsById.get(winner) ?? 0) < (ptsById.get(loser) ?? 0)) ent.upsets++;
                }
            }
            const pairList = [...pairs.values()];
            const mostGoals = [...pairList].sort((a, b) => b.goals - a.goals)[0];
            const mostDraws = [...pairList].sort((a, b) => b.draws - a.draws)[0];
            const mostUpsets = [...pairList].sort((a, b) => b.upsets - a.upsets)[0];

            // Trend analysis
            const totalRates = computeRates(groupMatches, coreIds[0] ?? -1); // not playerId-specific for BTTS/over
            // BTTS / Over X.5 are symmetric so playerId doesn't matter for these stats; but we used computeRates which uses playerId for clean sheet. Recompute symmetric.
            let bttsN = 0, ov25 = 0, ov35 = 0, ov45 = 0, totalN = 0;
            for (const m of groupMatches) {
                if (m.score1 == null || m.score2 == null) continue;
                totalN++;
                const t = m.score1 + m.score2;
                if (m.score1 > 0 && m.score2 > 0) bttsN++;
                if (t > 2.5) ov25++;
                if (t > 3.5) ov35++;
                if (t > 4.5) ov45++;
            }
            const pct = (x) => totalN ? Math.round(100 * x / totalN) : 0;

            // Tournament-level: draw % first half vs second half; avg goals first vs last per tournament
            const drawsFirst = [], drawsLast = [], goalsFirst = [], goalsLast = [];
            const byT = new Map();
            for (const m of groupMatches) {
                if (m.tournament_id == null) continue;
                if (!byT.has(m.tournament_id)) byT.set(m.tournament_id, []);
                byT.get(m.tournament_id).push(m);
            }
            for (const [tid, ms] of byT) {
                if (ms.length < 2) continue;
                const sorted = [...ms].sort((a, b) => new Date(a.date) - new Date(b.date));
                const half = Math.floor(sorted.length / 2);
                const first = sorted.slice(0, half), last = sorted.slice(-half);
                drawsFirst.push(...first.map(m => m.score1 === m.score2 ? 1 : 0));
                drawsLast.push(...last.map(m => m.score1 === m.score2 ? 1 : 0));
                goalsFirst.push(sorted[0].score1 + sorted[0].score2);
                goalsLast.push(sorted[sorted.length - 1].score1 + sorted[sorted.length - 1].score2);
            }
            const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
            const drawPctFirst = drawsFirst.length ? Math.round(100 * avg(drawsFirst)) : null;
            const drawPctLast = drawsLast.length ? Math.round(100 * avg(drawsLast)) : null;
            const goalsAvgFirst = goalsFirst.length ? avg(goalsFirst).toFixed(2) : '—';
            const goalsAvgLast = goalsLast.length ? avg(goalsLast).toFixed(2) : '—';

            // Swap UI: subs in this group + all floats
            const floats = state.members.filter(m => m.group_id === FLOAT_GROUP_ID);
            const swappable = [
                ...subIds.map(id => ({ player_id: id, role: 'sub', label: 'sub' })),
                ...floats.map(m => ({ player_id: m.player_id, role: 'float', label: 'float' })),
            ];

            app.innerHTML = `
                <section class="glass group-header">
                    <div>
                        <div class="gname">${esc(g.name)}</div>
                        <div class="gmeta">${coreIds.length} core · ${subIds.length} sub · ${groupMatches.length} finished group matches</div>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">League table</h2>
                    <div class="glass table-wrap">
                        <table class="data">
                            <thead><tr><th class="num">#</th><th>Player</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th></tr></thead>
                            <tbody>${table.map((r, i) => `<tr>
                                <td class="num muted">${i+1}</td>
                                <td>${playerLink(r.id)}</td>
                                <td class="num">${r.p}</td>
                                <td class="num">${r.w}</td>
                                <td class="num">${r.d}</td>
                                <td class="num">${r.l}</td>
                                <td class="num">${r.gf}</td>
                                <td class="num">${r.ga}</td>
                                <td class="num">${r.gd >= 0 ? '+' : ''}${r.gd}</td>
                                <td class="num accent">${r.pts}</td>
                            </tr>`).join('')}</tbody>
                        </table>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Roster · swap to refresh</h2>
                    <div class="glass" style="padding:22px">
                        ${coreIds.map(id => {
                            const p = state.playersById.get(id);
                            return `<div class="swap-row" data-core-id="${id}">
                                <div class="pname">${playerLink(id)} <span class="muted" style="font-size:12px">core</span></div>
                                <select data-core-id="${id}">
                                    <option value="">Swap with…</option>
                                    ${swappable.map(s => {
                                        const sp = state.playersById.get(s.player_id);
                                        return sp ? `<option value="${s.player_id}|${s.role}">${esc(sp.nickname)} (${s.label})</option>` : '';
                                    }).join('')}
                                </select>
                            </div>`;
                        }).join('')}
                        <div class="swap-row"><div class="muted" style="font-size:12px">Subs in this group: ${subIds.length ? subIds.map(id => playerLink(id)).join(', ') : '<span class="dim">none</span>'}</div></div>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Rivalry tracker</h2>
                    <div class="three-col">
                        ${rivalryCard('Most goals', mostGoals, p => `${p.goals} goals over ${p.matches.length} matches`)}
                        ${rivalryCard('Most draws', mostDraws, p => `${p.draws} draws over ${p.matches.length} matches`)}
                        ${rivalryCard('Most upsets', mostUpsets, p => `${p.upsets} upsets over ${p.matches.length} matches`)}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Trend analysis</h2>
                    <div class="glass" style="padding:0">
                        <table class="data">
                            <thead><tr><th>Metric</th><th class="num">Value</th><th class="muted">Notes</th></tr></thead>
                            <tbody>
                                <tr><td>BTTS %</td><td class="num accent">${pct(bttsN)}%</td><td class="muted">both teams scored</td></tr>
                                <tr><td>Over 2.5 goals</td><td class="num accent">${pct(ov25)}%</td><td class="muted">${ov25}/${totalN} matches</td></tr>
                                <tr><td>Over 3.5 goals</td><td class="num accent">${pct(ov35)}%</td><td class="muted">${ov35}/${totalN}</td></tr>
                                <tr><td>Over 4.5 goals</td><td class="num accent">${pct(ov45)}%</td><td class="muted">${ov45}/${totalN}</td></tr>
                                <tr><td>Draw % start vs end</td><td class="num">${drawPctFirst ?? '—'}% → ${drawPctLast ?? '—'}%</td><td class="muted">first vs last half of each tournament</td></tr>
                                <tr><td>Avg goals first vs last match</td><td class="num">${goalsAvgFirst} → ${goalsAvgLast}</td><td class="muted">per tournament</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Tournament history</h2>
                    <div style="display:flex;flex-direction:column;gap:10px">
                        ${tournamentList.length ? tournamentList.map(t => {
                            const ms = allFinished.filter(m => m.tournament_id === t.tid && (groupSet.has(m.player1_id) || groupSet.has(m.player2_id)));
                            return tournamentBlock(t.tid, ms, tourMeta.get(t.tid));
                        }).join('') : '<div class="glass empty">No tournaments involving this group.</div>'}
                    </div>
                </section>
            `;

            // Wire up swap dropdowns
            app.querySelectorAll('.swap-row select').forEach(sel => {
                sel.addEventListener('change', async (e) => {
                    const coreId = +sel.dataset.coreId;
                    const v = sel.value;
                    if (!v) return;
                    const [otherId, otherRole] = v.split('|').map((s, i) => i === 0 ? +s : s);
                    sel.disabled = true;
                    try {
                        // Find current rows
                        const coreRow = state.members.find(m => m.player_id === coreId && m.group_id === gid);
                        const otherRow = state.members.find(m => m.player_id === otherId);
                        if (!coreRow || !otherRow) throw new Error('membership row missing');
                        // Swap: core goes to other's group/role, other becomes core in this group
                        const { error: e1 } = await sb.from('group_members').update({
                            group_id: otherRow.group_id, role: otherRow.role,
                        }).eq('id', coreRow.id);
                        if (e1) throw e1;
                        const { error: e2 } = await sb.from('group_members').update({
                            group_id: gid, role: 'core',
                        }).eq('id', otherRow.id);
                        if (e2) throw e2;
                        // Reload memberships and re-render
                        await loadGroupsAndMembers();
                        await render();
                    } catch (err) {
                        console.error(err);
                        alert('Swap failed: ' + (err.message ?? err));
                        sel.disabled = false;
                    }
                });
            });

            // Wire up tournament collapsibles
            app.querySelectorAll('.tournament-block .head').forEach(h => {
                h.addEventListener('click', () => h.parentElement.classList.toggle('open'));
            });
        }

        function rivalryCard(title, pair, formatter) {
            if (!pair) return `<div class="glass opp-card"><div class="sub">${title}</div><div class="muted">no data</div></div>`;
            return `<div class="glass opp-card">
                <div class="sub">${title}</div>
                <div class="nick">${playerLink(pair.lo)} <span class="muted">vs</span> ${playerLink(pair.hi)}</div>
                <div class="muted" style="font-size:12px;margin-top:8px">${formatter(pair)}</div>
            </div>`;
        }

            if (!a || !b) { container.innerHTML = '<div class="glass empty">One of the players was not found.</div>'; return; }
            destroyCharts();
            const allFinished = await fetchAllFinished();
            const aMatches = allFinished.filter(m => m.player1_id === a.id || m.player2_id === a.id);
            const bMatches = allFinished.filter(m => m.player1_id === b.id || m.player2_id === b.id);
            const aPS = (await sb.from('player_stats').select('*').eq('player_id', a.id).limit(1)).data?.[0] ?? null;
            const bPS = (await sb.from('player_stats').select('*').eq('player_id', b.id).limit(1)).data?.[0] ?? null;
            const aRates = computeRates(aMatches, a.id);
            const bRates = computeRates(bMatches, b.id);
            const aClutch = computeClutch(allFinished, a.id);
            const bClutch = computeClutch(allFinished, b.id);
            const aStreak = computeStreak(aMatches, a.id);
            const bStreak = computeStreak(bMatches, b.id);
            const aWR = aPS?.matches_played ? Math.round(100 * aPS.wins / aPS.matches_played) : 0;
            const bWR = bPS?.matches_played ? Math.round(100 * bPS.wins / bPS.matches_played) : 0;

            const aLast5 = aMatches.slice(0, 5);
            const bLast5 = bMatches.slice(0, 5);

            // H2H
            const lo = Math.min(a.id, b.id), hi = Math.max(a.id, b.id);
            const { data: h2hData } = await sb.from('h2h_stats').select('*').eq('player1_id', lo).eq('player2_id', hi).limit(1);
            const h = h2hData?.[0];

            const distA = buildScoreDistribution(aMatches, a.id);
            const distB = buildScoreDistribution(bMatches, b.id);

            const cmpRow = (label, av, bv, win) => {
                let aClass = '', bClass = '';
                if (win === 'higher') { if (av > bv) aClass = 'win'; else if (bv > av) bClass = 'win'; }
                else if (win === 'lower') { if (av < bv) aClass = 'win'; else if (bv < av) bClass = 'win'; }
                return `<div class="compare-stat-row">
                    <div class="left v ${aClass}">${av}</div>
                    <div class="lab">${esc(label)}</div>
                    <div class="right v ${bClass}">${bv}</div>

            };
            const fmtR = (r) => r === 'W' ? '<span class="badge W">W</span>' : r === 'L' ? '<span class="badge L">L</span>' : '<span class="badge D">D</span>';

            container.innerHTML = `
                <div class="compare-grid" style="margin-bottom:18px">
                    <div class="glass" style="padding:24px">
                        <div style="font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px">${playerLink(a.id)}</div>
                        <div class="muted" style="font-size:12px">${esc(state.groupsById.get(state.memberByPlayerId.get(a.id)?.group_id)?.name ?? '')}</div>
                    </div>
                    <div class="glass" style="padding:24px">
                        <div style="font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px">${playerLink(b.id)}</div>
                        <div class="muted" style="font-size:12px">${esc(state.groupsById.get(state.memberByPlayerId.get(b.id)?.group_id)?.name ?? '')}</div>

                </div>

                <div class="glass" style="padding:0;margin-bottom:18px">
                    ${cmpRow('Matches', aPS?.matches_played ?? 0, bPS?.matches_played ?? 0, 'higher')}
                    ${cmpRow('Wins', aPS?.wins ?? 0, bPS?.wins ?? 0, 'higher')}
                    ${cmpRow('Win rate', `${aWR}%`, `${bWR}%`, 'higher')}
                    ${cmpRow('Avg GF', Number(aPS?.avg_gf ?? 0).toFixed(2), Number(bPS?.avg_gf ?? 0).toFixed(2), 'higher')}
                    ${cmpRow('Avg GA', Number(aPS?.avg_ga ?? 0).toFixed(2), Number(bPS?.avg_ga ?? 0).toFixed(2), 'lower')}
                    ${cmpRow('Clean sheets', `${aRates.cleanSheetPct}%`, `${bRates.cleanSheetPct}%`, 'higher')}
                    ${cmpRow('High-scoring (&gt;3.5)', `${aRates.over35Pct}%`, `${bRates.over35Pct}%`, 'higher')}
                    ${cmpRow('Clutch (final-match WR)', aClutch.clutchPct == null ? '—' : `${aClutch.clutchPct}%`, bClutch.clutchPct == null ? '—' : `${bClutch.clutchPct}%`, 'higher')}
                    ${cmpRow('Current streak', aStreak ?? '—', bStreak ?? '—', null)}
                </div>

                ${h ? `<div class="glass" style="padding:24px;margin-bottom:18px">
                    <div class="section-title">Head to head</div>
                    <div style="display:flex;justify-content:space-around;text-align:center">
                        <div><div style="font-size:32px;font-weight:700" class="accent">${a.id === lo ? h.wins_p1 : h.wins_p2}</div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">wins</div></div>
                        <div><div style="font-size:32px;font-weight:700">${h.matches_played}</div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">matches · ${h.draws} draws</div></div>
                        <div><div style="font-size:32px;font-weight:700" class="accent">${a.id === lo ? h.wins_p2 : h.wins_p1}</div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">wins</div></div>
                    </div>
                </div>` : ''}

                <div class="compare-grid" style="margin-bottom:18px">
                    <div class="glass" style="padding:22px">
                        <div class="section-title">Last 5 — ${esc(a.nickname)}</div>

                            <span class="muted" style="font-size:11px">${fmtAgo(m.date)}</span>

                    <div class="glass chart-wrap tall"><canvas id="dist-b"></canvas></div>

                        { label: 'Draws',  data: dist.draws,  backgroundColor: 'rgba(255,255,255,0.25)' },
                        { label: 'Losses', data: dist.losses, backgroundColor: 'rgba(255,91,91,0.7)' },

                });

            mkDistChart('dist-a', distA);

        // ---------- PREDICTIONS ----------
        async function renderPredictions(app) {
            let all;
            try {
                const { data, error } = await sb.from('predictions').select(`
                    id, predicted_winner_id, predicted_score1, predicted_score2, confidence,
                    winner_correct, score_correct, evaluated_at,
                    match:matches!predictions_match_id_fkey(id, date, status, score1, score2, player1_id, player2_id)
                `).order('id', { ascending: false }).limit(500);
                if (error) throw error;
                all = data ?? [];
            } catch (e) {
                app.innerHTML = `<section class="glass empty">
                    The <code>predictions</code> table doesn't exist yet. Apply the migration in <code>sql/schema.sql</code>.
                </section>`;
                return;
            }
            const evaluated = all.filter(p => p.evaluated_at);
            const wOK = evaluated.filter(p => p.winner_correct).length;
            const sOK = evaluated.filter(p => p.score_correct).length;
            const wAcc = evaluated.length ? Math.round(100 * wOK / evaluated.length) : 0;
            const sAcc = evaluated.length ? Math.round(100 * sOK / evaluated.length) : 0;

            // Group breakdown
            const byGroup = new Map();
            for (const p of evaluated) {
                if (!p.match) continue;
                const m1 = state.memberByPlayerId.get(p.match.player1_id);
                const m2 = state.memberByPlayerId.get(p.match.player2_id);
                // Use the group of either core player, preferring same-group matches
                let gid = null;
                if (m1 && m2 && m1.group_id === m2.group_id && m1.group_id !== FLOAT_GROUP_ID) gid = m1.group_id;
                else if (m1?.group_id !== FLOAT_GROUP_ID) gid = m1?.group_id ?? null;
                else gid = m2?.group_id ?? null;
                if (gid == null) continue;
                if (!byGroup.has(gid)) byGroup.set(gid, []);
                byGroup.get(gid).push(p);
            }
            const groupBreakdown = state.groups.filter(g => g.id !== FLOAT_GROUP_ID).map(g => {
                const set = byGroup.get(g.id) ?? [];
                const c = set.filter(p => p.winner_correct).length;
                return { group: g, n: set.length, pct: set.length ? Math.round(100 * c / set.length) : null };
            });

            const renderWith = (filter) => {
                let rows = all;
                if (filter === 'pending') rows = all.filter(p => !p.evaluated_at);
                else if (filter === 'correct') rows = evaluated.filter(p => p.winner_correct);
                else if (filter === 'incorrect') rows = evaluated.filter(p => !p.winner_correct);
                return rows.map(predictionRow).join('') || '<tr><td colspan="9" class="empty">No predictions in this view.</td></tr>';
            };

            app.innerHTML = `
                <section>
                    <div class="stats-grid">
                        ${statCard('Total predictions', all.length)}
                        ${statCard('Evaluated', evaluated.length)}
                        ${statCard('Winner accuracy', `<span class="accent">${wAcc}%</span>`)}
                        ${statCard('Exact-score accuracy', `<span class="accent">${sAcc}%</span>`)}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Accuracy by group</h2>
                    <div class="glass table-wrap">
                        <table class="data">
                            <thead><tr><th>Group</th><th class="num">Evaluated</th><th class="num">Winner accuracy</th></tr></thead>
                            <tbody>
                                ${groupBreakdown.length ? groupBreakdown.map(b => `<tr>
                                    <td><a class="player-link" href="#/group/${b.group.id}">${esc(b.group.name)}</a></td>
                                    <td class="num">${b.n}</td>
                                    <td class="num">${b.pct == null ? '<span class="muted">—</span>' : `<span class="accent">${b.pct}%</span>`}</td>
                                </tr>`).join('') : '<tr><td colspan="3" class="empty">No graded predictions yet.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </section>

                <section>
                    <div class="filter-pills" id="pred-filters">
                        <button class="pill active" data-f="all">All</button>
                        <button class="pill" data-f="pending">Pending</button>
                        <button class="pill" data-f="correct">Correct</button>
                        <button class="pill" data-f="incorrect">Incorrect</button>
                    </div>
                    <div class="glass scroll-table">
                        <table class="data">
                            <thead><tr>
                                <th>Match date</th><th>Player 1</th><th>Player 2</th>
                                <th>Predicted winner</th><th class="num">Confidence</th>
                                <th class="num">Predicted</th><th class="num">Actual</th>
                                <th>Winner</th><th>Score</th>
                            </tr></thead>
                            <tbody id="pred-tbody">${renderWith('all')}</tbody>
                        </table>
                    </div>
                </section>
            `;

            const pillsEl = document.getElementById('pred-filters');
            const tbody = document.getElementById('pred-tbody');
            pillsEl.addEventListener('click', (e) => {
                const btn = e.target.closest('.pill');
                if (!btn) return;
                pillsEl.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p === btn));
                tbody.innerHTML = renderWith(btn.dataset.f);
            });
        }

        function predictionRow(p) {
            if (!p.match) return '';
            const m = p.match;
            const winnerName = p.predicted_winner_id ? playerLink(p.predicted_winner_id) : '<span class="dim">draw</span>';
            const actual = m.status === STATUS.FINISHED ? `${m.score1 ?? '–'}–${m.score2 ?? '–'}` : '<span class="dim">—</span>';
            const wIcon = p.evaluated_at ? (p.winner_correct ? '<span class="check">✓</span>' : '<span class="cross">✗</span>') : '<span class="dim">—</span>';
            const sIcon = p.evaluated_at ? (p.score_correct ? '<span class="check">✓</span>' : '<span class="cross">✗</span>') : '<span class="dim">—</span>';
            return `<tr>
                <td>${fmtTime(m.date)}</td>
                <td>${playerLink(m.player1_id)}</td>
                <td>${playerLink(m.player2_id)}</td>
                <td>${winnerName}</td>
                <td class="num accent">${Number(p.confidence ?? 0).toFixed(0)}%</td>
                <td class="num">${p.predicted_score1 ?? '–'}–${p.predicted_score2 ?? '–'}</td>
                <td class="num">${actual}</td>
                <td>${wIcon}</td>
                <td>${sIcon}</td>
            </tr>`;
        }

        // ---------- search & drawer ----------
        function renderSearchResults(query) {
            const dropdown = document.getElementById('search-dropdown');
            const q = query.trim().toLowerCase();
            if (!q) { dropdown.classList.remove('open'); dropdown.innerHTML = ''; return; }
            const matches = state.players.filter(p => p.nickname && p.nickname.toLowerCase().includes(q)).slice(0, 10);
            if (!matches.length) {
                dropdown.innerHTML = '<div class="empty-row">No matching player.</div>';
            } else {
                dropdown.innerHTML = matches.map(p => {
                    const i = p.nickname.toLowerCase().indexOf(q);
                    const html = i >= 0
                        ? esc(p.nickname.slice(0, i)) + '<mark>' + esc(p.nickname.slice(i, i + q.length)) + '</mark>' + esc(p.nickname.slice(i + q.length))
                        : esc(p.nickname);
                    return `<a href="#/player/${encodeURIComponent(p.nickname)}">${html}</a>`;
                }).join('');
            }
            dropdown.classList.add('open');
        }
        function setupSearch() {
            const input = document.getElementById('search-input');
            const dropdown = document.getElementById('search-dropdown');
            input.addEventListener('input', e => renderSearchResults(e.target.value));
            input.addEventListener('focus', e => { if (e.target.value.trim()) renderSearchResults(e.target.value); });
            document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) dropdown.classList.remove('open'); });
            dropdown.addEventListener('click', () => { input.value = ''; dropdown.classList.remove('open'); });
        }
        function setupDrawer() {
            const drawer = document.getElementById('players-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            const btn = document.getElementById('players-btn');
            const list = document.getElementById('players-list');
            const groupedByGroup = new Map();
            for (const p of state.players) {
                const m = state.memberByPlayerId.get(p.id);
                const gid = m ? m.group_id : null;
                if (!groupedByGroup.has(gid)) groupedByGroup.set(gid, []);
                groupedByGroup.get(gid).push(p);
            }
            const blocks = [];
            for (const g of state.groups) {
                const set = groupedByGroup.get(g.id);
                if (!set?.length) continue;
                blocks.push(`<div class="group-block">
                    <div class="gname">${esc(g.name)}</div>
                    ${set.map(p => `<a href="#/player/${encodeURIComponent(p.nickname)}">${esc(p.nickname)}</a>`).join('')}
                </div>`);
            }
            const ungrouped = groupedByGroup.get(null);
            if (ungrouped?.length) {
                blocks.push(`<div class="group-block">
                    <div class="gname">Unassigned</div>
                    ${ungrouped.map(p => `<a href="#/player/${encodeURIComponent(p.nickname)}">${esc(p.nickname)}</a>`).join('')}
                </div>`);
            }
            list.innerHTML = blocks.join('');
            const open = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
            const close = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };
            btn.addEventListener('click', open);
            backdrop.addEventListener('click', close);
            drawer.addEventListener('click', e => { if (e.target.tagName === 'A') close(); });
        }

        // ---------- bootstrap ----------
        async function loadGroupsAndMembers() {
            const [groups, members] = await Promise.all([
                loadAll('groups', 'id, name, created_at').catch(() => []),
                loadAll('group_members', 'id, group_id, player_id, role, created_at').catch(() => []),
            ]);
            state.groups = groups.sort((a, b) => a.id - b.id);
            state.groupsById = new Map(groups.map(g => [g.id, g]));
            state.members = members;
            state.memberByPlayerId = new Map(members.map(m => [m.player_id, m]));
        }

        async function init() {
            try {
                state.players = (await loadAll('players', 'id, nickname, photo'))
                    .filter(p => p.nickname)
                    .sort((a, b) => a.nickname.localeCompare(b.nickname, undefined, { sensitivity: 'base' }));
                state.playersByName = new Map(state.players.map(p => [p.nickname.toLowerCase(), p]));
                state.playersById = new Map(state.players.map(p => [p.id, p]));
                await loadGroupsAndMembers();
                setupSearch();
                setupDrawer();
                await render();
                setInterval(() => render(), REFRESH_MS);
            } catch (err) {
                document.getElementById('app').innerHTML =
                    `<div class="empty">Failed to bootstrap: ${esc(err.message ?? err)}</div>`;
            }
        }
        init();
    </script>
</body>
</html>
