<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esports Battle Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #080808;
            --text: #f3f3f5;
            --muted: #888;
            --dim: #555;
            --accent: #00ff87;
            --danger: #ff5b5b;
            --warn: #ffb547;
            --glass: rgba(255,255,255,0.05);
            --glass-strong: rgba(255,255,255,0.07);
            --line: rgba(255,255,255,0.08);
            --line-soft: rgba(255,255,255,0.05);
        }
        * { box-sizing: border-box; }
        html, body { background: var(--bg); margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text); font-weight: 400;
            -webkit-font-smoothing: antialiased;
            min-width: 1200px;
            font-feature-settings: 'cv11', 'ss01';
        }
        a { color: inherit; text-decoration: none; }
        button, select { font-family: inherit; }
        button { border: none; cursor: pointer; }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            border-radius: 16px;
        }
        .accent { color: var(--accent); }
        .muted { color: var(--muted); }
        .dim { color: var(--dim); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .right { margin-left: auto; }
        .nowrap { white-space: nowrap; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Top nav */
        #topnav {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 32px;
            display: flex; align-items: center; gap: 24px;
            background: rgba(8,8,8,0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--line-soft);
        }
        .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; cursor: pointer; }
        .logo .accent { color: var(--accent); }
        .search-wrap { flex: 1; max-width: 520px; margin: 0 auto; position: relative; }
        .search-input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            font: 400 14px 'Inter', sans-serif;
        }
        .search-input:focus { outline: none; border-color: rgba(0,255,135,0.4); background: var(--glass-strong); }
        .search-input::placeholder { color: var(--dim); }
        .search-dropdown {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0;
            background: rgba(18,18,20,0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--line);
            border-radius: 10px;
            max-height: 360px; overflow-y: auto;
            z-index: 200;
            display: none;
        }
        .search-dropdown.open { display: block; }
        .search-dropdown a {
            display: block; padding: 10px 16px; font-size: 14px;
            border-bottom: 1px solid var(--line-soft);
        }
        .search-dropdown a:last-child { border-bottom: 0; }
        .search-dropdown a:hover { background: rgba(0,255,135,0.08); color: var(--accent); }
        .search-dropdown .empty-row { padding: 14px 16px; color: var(--muted); font-size: 13px; font-style: italic; }
        .search-dropdown a mark { color: var(--accent); background: transparent; }

        .nav-links { display: flex; gap: 8px; align-items: center; }
        .btn {
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: var(--glass-strong); border-color: rgba(255,255,255,0.14); }
        .btn.active { background: rgba(0,255,135,0.12); border-color: rgba(0,255,135,0.4); color: var(--accent); }
        .btn.primary { background: var(--accent); color: #001a0e; border-color: var(--accent); font-weight: 700; }
        .btn.primary:hover { filter: brightness(1.1); }
        .small-btn { padding: 6px 12px; font-size: 12px; }

        /* Activity ticker */
        .ticker-wrap {
            background: rgba(13,13,15,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line-soft);
            padding: 10px 0;
            overflow: hidden;
            position: relative;
        }
        .ticker-wrap::before, .ticker-wrap::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 60px; z-index: 5; pointer-events: none;
        }
        .ticker-wrap::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
        .ticker-wrap::after { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
        .ticker-track {
            display: flex; gap: 28px; align-items: center;
            white-space: nowrap;
            animation: ticker-scroll 90s linear infinite;
            width: max-content;
        }
        .ticker-track:hover { animation-play-state: paused; }
        .ticker-item {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; padding: 0 14px; border-right: 1px solid var(--line-soft);
        }
        .ticker-item:last-child { border-right: 0; }
        .ticker-item .score { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .ticker-item .meta { color: var(--muted); font-size: 11px; margin-left: 4px; }
        @keyframes ticker-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Drawer */
        .drawer-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.15s;
        }
        .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
        .players-drawer {
            position: fixed; top: 0; right: 0;
            width: 340px; height: 100vh;
            background: rgba(14,14,16,0.96);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-left: 1px solid var(--line);
            z-index: 200;
            padding: 24px;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.2s ease;
        }
        .players-drawer.open { transform: translateX(0); }
        .players-drawer h3 {
            margin: 0 0 14px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--muted); font-weight: 600;
        }
        .players-drawer a {
            display: block; padding: 9px 12px; border-radius: 8px;
            font-size: 14px;
        }
        .players-drawer a:hover { background: rgba(0,255,135,0.1); color: var(--accent); }
        .players-drawer .group-block { margin-bottom: 18px; }
        .players-drawer .group-block .gname { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.4px; padding: 6px 12px; font-weight: 600; }

        /* Main */
        main { max-width: 1400px; margin: 0 auto; padding: 28px 32px 64px; }
        section { margin-bottom: 38px; }
        .section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.6px;
            color: var(--muted); font-weight: 600; margin: 0 0 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title .right { margin-left: auto; color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; }

        /* Stat cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-card { padding: 22px 24px; }
        .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; margin-bottom: 12px; }
        .stat-card .value { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
        .stat-card .value.accent { color: var(--accent); }
        .stat-card .delta { font-size: 12px; color: var(--muted); margin-top: 8px; }

        /* Match cards */
        .match-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .match-card { padding: 16px 22px; }
        .match-card:hover { border-color: rgba(0,255,135,0.2); }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
        .match-card .player { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .match-card .player.right { text-align: right; align-items: flex-end; }
        .match-card .nick { font-weight: 600; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .match-card .nick a { color: var(--text); }
        .match-card .nick a:hover { color: var(--accent); }
        .match-card .team { font-size: 11px; color: var(--muted); }
        .match-card .score {
            font-size: 24px; font-weight: 700; min-width: 80px; text-align: center;
            font-variant-numeric: tabular-nums; letter-spacing: -0.5px;
        }
        .match-card .score.live { color: var(--danger); }
        .match-card .score.upcoming { font-size: 12px; color: var(--dim); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
        .match-card .score.finished { color: var(--accent); }
        .match-card .meta {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid var(--line-soft);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--muted);
        }
        .match-card .pred {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--line-soft);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--muted);
        }
        .match-card .pred .conf { color: var(--accent); font-weight: 600; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
        .badge.live { background: rgba(255,91,91,0.15); color: var(--danger); border: 1px solid rgba(255,91,91,0.35); }
        .badge.upcoming { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--line); }
        .badge.finished { background: rgba(0,255,135,0.1); color: var(--accent); border: 1px solid rgba(0,255,135,0.3); }
        .badge.W { background: rgba(0,255,135,0.15); color: var(--accent); }
        .badge.D { background: rgba(255,255,255,0.06); color: #aaa; }
        .badge.L { background: rgba(255,91,91,0.15); color: var(--danger); }
        .badge.streak-W { background: rgba(0,255,135,0.15); color: var(--accent); border: 1px solid rgba(0,255,135,0.3); }
        .badge.streak-L { background: rgba(255,91,91,0.15); color: var(--danger); border: 1px solid rgba(255,91,91,0.3); }
        .badge.streak-D { background: rgba(255,255,255,0.06); color: #aaa; border: 1px solid var(--line); }

        /* Tournament block (collapsible) */
        .tournament-block { padding: 0; overflow: hidden; }
        .tournament-block .head {
            padding: 14px 22px; display: flex; align-items: center; gap: 12px; cursor: pointer;
            border-bottom: 1px solid transparent;
        }
        .tournament-block.open .head { border-bottom-color: var(--line-soft); }
        .tournament-block .head .tname { font-weight: 600; font-size: 14px; }
        .tournament-block .head .tdate { color: var(--muted); font-size: 12px; }
        .tournament-block .head .chev { margin-left: auto; transition: transform 0.15s; color: var(--muted); }
        .tournament-block.open .head .chev { transform: rotate(90deg); color: var(--accent); }
        .tournament-block .body { display: none; padding: 0; }
        .tournament-block.open .body { display: block; }

        /* Tables */
        table.data { width: 100%; border-collapse: collapse; }
        table.data th, table.data td {
            padding: 11px 18px; text-align: left;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13px;
        }
        table.data tr:last-child td { border-bottom: 0; }
        table.data th {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--muted); font-weight: 600; background: rgba(255,255,255,0.02);
        }
        table.data tbody tr:hover { background: rgba(255,255,255,0.02); }
        .table-wrap { overflow: hidden; }
        .scroll-table { overflow: auto; max-height: 70vh; }
        .scroll-table table.data thead th { position: sticky; top: 0; background: rgba(15,15,17,0.95); z-index: 1; }

        /* Player profile */
        .player-header { padding: 30px 36px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
        .player-header .name-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
        .player-header .name { font-size: 38px; font-weight: 800; letter-spacing: -1.2px; line-height: 1; }
        .player-header .group-tag { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; padding: 4px 10px; border: 1px solid rgba(0,255,135,0.3); border-radius: 999px; background: rgba(0,255,135,0.08); }
        .player-header .role-tag { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); }
        .player-header .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 28px; }
        .qs-item .v { font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .qs-item .v.accent { color: var(--accent); }
        .qs-item .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }

        .form-strip { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .form-strip.compact { gap: 3px; }
        .form-dot {
            width: 26px; height: 26px; border-radius: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 10px; flex-shrink: 0;
        }
        .form-strip.compact .form-dot { width: 18px; height: 18px; font-size: 9px; border-radius: 4px; }
        .form-dot.W { background: rgba(0,255,135,0.16); color: var(--accent); border: 1px solid rgba(0,255,135,0.35); }
        .form-dot.D { background: rgba(255,255,255,0.06); color: #aaa; border: 1px solid var(--line); }
        .form-dot.L { background: rgba(255,91,91,0.14); color: var(--danger); border: 1px solid rgba(255,91,91,0.3); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

        .opp-card { padding: 20px; }
        .opp-card .nick { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .opp-card .sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; font-weight: 600; }
        .opp-card .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .opp-card .row .v { font-size: 18px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .opp-card .row .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
        .opp-card .last5 { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }

        .h2h-result { padding: 28px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; }
        .h2h-result .col { text-align: center; }
        .h2h-result .nick { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
        .h2h-result .stat-big { font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -1px; }
        .h2h-result .stat-mid { font-size: 22px; font-weight: 700; line-height: 1; }
        .h2h-result .row { margin-top: 12px; }
        .h2h-result .row:first-child { margin-top: 0; }
        .h2h-result .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; font-weight: 600; }
        .h2h-extras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 22px 28px; border-top: 1px solid var(--line-soft); margin-top: 0; }
        .h2h-extras .ext { text-align: center; }
        .h2h-extras .ext .v { font-size: 20px; font-weight: 700; color: var(--accent); line-height: 1; }
        .h2h-extras .ext .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; font-weight: 600; }

        .chart-wrap { padding: 24px; height: 300px; position: relative; }
        .chart-wrap canvas { max-height: 252px; }
        .chart-wrap.tall { height: 360px; }
        .chart-wrap.tall canvas { max-height: 312px; }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .controls input, .controls select { padding: 9px 13px; min-width: 200px; }

        .filter-pills { display: flex; gap: 8px; }
        .pill {
            padding: 7px 16px;
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 12px; font-weight: 500;
        }
        .pill.active { background: var(--accent); color: #001a0e; border-color: var(--accent); font-weight: 700; }

        .check { color: var(--accent); font-weight: 700; }
        .cross { color: var(--danger); font-weight: 700; }

        .empty { padding: 40px; text-align: center; color: var(--muted); font-style: italic; font-size: 13px; }
        .loading { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

        a.player-link { color: var(--text); border-bottom: 1px dotted transparent; transition: color 0.1s; }
        a.player-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

        /* Group cards */
        .groups-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .group-card { padding: 22px 24px; cursor: pointer; transition: border-color 0.15s; }
        .group-card:hover { border-color: rgba(0,255,135,0.3); }
        .group-card .ghead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .group-card .gname { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
        .group-card .gcount { font-size: 11px; color: var(--muted); margin-left: auto; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .group-card .members { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .group-card .members a { padding: 4px 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; }
        .group-card .members a:hover { background: rgba(0,255,135,0.1); color: var(--accent); border-color: rgba(0,255,135,0.3); }
        .group-card .mini-table { font-size: 12px; }
        .group-card .mini-table th, .group-card .mini-table td { padding: 6px 10px; }

        /* Group page */
        .group-header { padding: 30px 36px; display: flex; align-items: center; gap: 24px; }
        .group-header .gname { font-size: 36px; font-weight: 800; letter-spacing: -1.2px; line-height: 1; }
        .group-header .gmeta { color: var(--muted); font-size: 13px; }

        .swap-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
        .swap-row:last-child { border-bottom: 0; }
        .swap-row select { background: var(--glass); border: 1px solid var(--line); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 12px; min-width: 160px; }
        .swap-row select:focus { outline: none; border-color: rgba(0,255,135,0.4); }
        .swap-row .pname { font-weight: 600; font-size: 14px; }

        /* Compare page */
        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .compare-stat-row { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--line-soft); align-items: center; font-size: 14px; }
        .compare-stat-row:last-child { border-bottom: 0; }
        .compare-stat-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
        .compare-stat-row .v.win { color: var(--accent); }
        .compare-stat-row .lab { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .compare-stat-row.left .v.win { text-align: right; }
        .compare-stat-row .left { text-align: right; }
        .compare-stat-row .right { text-align: left; margin-left: 0; }

        @media (max-width: 1199px) {
            body { min-width: 0; }
        }
    </style>
</head>
<body>
    <nav id="topnav">
        <a class="logo" href="#/">Esports Battle <span class="accent">Analytics</span></a>
        <div class="search-wrap">
            <input id="search-input" class="search-input" type="text"
                   placeholder="Search player nickname…" autocomplete="off" spellcheck="false">
            <div id="search-dropdown" class="search-dropdown"></div>
        </div>
        <div class="nav-links">
            <a class="btn" href="#/groups" id="nav-groups">Groups</a>
            <a class="btn" href="#/compare" id="nav-compare">Compare</a>
            <a class="btn" href="#/predictions" id="nav-predictions">Predictions</a>
            <button class="btn" id="players-btn">Players</button>
        </div>
    </nav>

    <div id="ticker-wrap" class="ticker-wrap" style="display:none">
        <div id="ticker-track" class="ticker-track"></div>
    </div>

    <main id="app">
        <div class="loading">Loading…</div>
    </main>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="players-drawer" class="players-drawer">
        <h3>All Players</h3>
        <div id="players-list"></div>
    </aside>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL = "https://mdvocpljvyhcrthoqysm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kdm9jcGxqdnloY3J0aG9xeXNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTI0NDAsImV4cCI6MjA5MzMyODQ0MH0.1dv7H7Wh1yIgkwcLddCgvZgFASfOPm8DhGsgYbkeBdU";
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const REFRESH_MS = 5 * 60 * 1000;
        const STATUS = { UPCOMING: 1, LIVE: 2, FINISHED: 3 };
        const FLOAT_GROUP_ID = 8;

        const state = {
            players: [],
            playersByName: new Map(),
            playersById: new Map(),
            groups: [],
            groupsById: new Map(),
            members: [],
            memberByPlayerId: new Map(),
            charts: [],
        };

        // ---------- utils ----------
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
            { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
        ));
        const fmtTime = (t) => new Date(t).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
        const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { dateStyle: 'medium' });
        const fmtAgo = (t) => {
            const s = (Date.now() - new Date(t).getTime()) / 1000;
            if (s < 60) return Math.floor(s) + 's ago';
            if (s < 3600) return Math.floor(s/60) + 'm ago';
            if (s < 86400) return Math.floor(s/3600) + 'h ago';
            return Math.floor(s/86400) + 'd ago';
        };
        const playerLink = (id) => {
            const p = state.playersById.get(id);
            if (!p) return `<span class="dim">#${id}</span>`;
            return `<a class="player-link" href="#/player/${encodeURIComponent(p.nickname)}">${esc(p.nickname)}</a>`;
        };
        const destroyCharts = () => { state.charts.forEach(c => { try { c.destroy(); } catch(e){} }); state.charts = []; };

        // ---------- result helpers ----------
        function resultOf(m, playerId) {
            const isP1 = m.player1_id === playerId;
            const own = isP1 ? m.score1 : m.score2;
            const opp = isP1 ? m.score2 : m.score1;
            if (own == null || opp == null) return null;
            return own > opp ? 'W' : own < opp ? 'L' : 'D';
        }
        function ownGoals(m, playerId) {
            return m.player1_id === playerId ? m.score1 : m.score2;
        }
        function oppGoals(m, playerId) {
            return m.player1_id === playerId ? m.score2 : m.score1;
        }

        // ---------- routing ----------
        function getRoute() {
            const h = (location.hash || '#/').slice(1);
            let m;
            if ((m = h.match(/^\/player\/(.+)$/))) return { name: 'player', nickname: decodeURIComponent(m[1]) };
            if (h === '/predictions') return { name: 'predictions' };
            if (h === '/groups') return { name: 'groups' };
            if ((m = h.match(/^\/group\/(\d+)$/))) return { name: 'group', id: +m[1] };
            if ((m = h.match(/^\/compare(?:\/(.+?)\/(.+))?$/))) {
                return { name: 'compare', a: m[1] && decodeURIComponent(m[1]), b: m[2] && decodeURIComponent(m[2]) };
            }
            return { name: 'home' };
        }

        function updateNavActive() {
            const r = getRoute();
            for (const id of ['nav-groups', 'nav-compare', 'nav-predictions']) {
                document.getElementById(id).classList.remove('active');
            }
            if (r.name === 'groups' || r.name === 'group') document.getElementById('nav-groups').classList.add('active');
            else if (r.name === 'compare') document.getElementById('nav-compare').classList.add('active');
            else if (r.name === 'predictions') document.getElementById('nav-predictions').classList.add('active');
        }

        async function render() {
            updateNavActive();
            destroyCharts();
            const r = getRoute();
            const app = document.getElementById('app');
            app.innerHTML = '<div class="loading">Loading…</div>';
            try {
                if (r.name === 'home') await renderHome(app);
                else if (r.name === 'player') await renderPlayer(app, r.nickname);
                else if (r.name === 'groups') await renderGroups(app);
                else if (r.name === 'group') await renderGroup(app, r.id);
                else if (r.name === 'compare') await renderCompare(app, r.a, r.b);
                else if (r.name === 'predictions') await renderPredictions(app);
            } catch (err) {
                console.error(err);
                app.innerHTML = `<div class="empty">Failed to load: ${esc(err.message ?? err)}</div>`;
            }
            await renderTicker();
        }
        window.addEventListener('hashchange', render);

        // ---------- bootstrap ----------
        async function loadAll(table, columns = '*', applyFilter) {
            const all = []; let from = 0; const PAGE = 1000;
            while (true) {
                let q = sb.from(table).select(columns).range(from, from + PAGE - 1);
                if (applyFilter) q = applyFilter(q);
                const { data, error } = await q;
                if (error) throw error;
                all.push(...data);
                if (data.length < PAGE) break;
                from += PAGE;
            }
            return all;
        }

        // ---------- queries ----------
        const MATCH_SELECT = `id, date, status, score1, score2, team1, team2, player1_id, player2_id, tournament_id`;

        async function fetchAllFinished() {
            return loadAll('matches', MATCH_SELECT, q => q.eq('status', STATUS.FINISHED).order('date', { ascending: false }));
        }
        async function fetchLive() {
            const { data, error } = await sb.from('matches').select(MATCH_SELECT)
                .eq('status', STATUS.LIVE).order('date', { ascending: true }).limit(20);
            if (error) throw error;
            return data ?? [];
        }
        async function fetchUpcoming(limit = 20) {
            const { data, error } = await sb.from('matches').select(MATCH_SELECT)
                .eq('status', STATUS.UPCOMING).order('date', { ascending: true }).limit(limit);
            if (error) throw error;
            return data ?? [];
        }
        async function fetchPredictionsForMatchIds(ids) {
            if (!ids.length) return new Map();
            try {
                const { data, error } = await sb.from('predictions')
                    .select('match_id, predicted_winner_id, predicted_score1, predicted_score2, confidence')
                    .in('match_id', ids);
                if (error) return new Map();
                return new Map((data ?? []).map(p => [p.match_id, p]));
            } catch { return new Map(); }
        }
        async function fetchTournamentsByIds(ids) {
            if (!ids.length) return new Map();
            const map = new Map();
            const BATCH = 200;
            for (let i = 0; i < ids.length; i += BATCH) {
                const slice = ids.slice(i, i + BATCH);
                const { data, error } = await sb.from('tournaments').select('id, name, date').in('id', slice);
                if (error) throw error;
                for (const t of data ?? []) map.set(t.id, t);
            }
            return map;
        }

        // ---------- analytics helpers ----------
        function pointsForResult(r) { return r === 'W' ? 3 : r === 'D' ? 1 : 0; }

        function buildHottestPlayer(allFinished) {
            // Last 5 finished per player; W=3 D=1 L=0; sort by points desc.
            const byPlayer = new Map();
            for (const m of allFinished) {
                if (!byPlayer.has(m.player1_id)) byPlayer.set(m.player1_id, []);
                if (!byPlayer.has(m.player2_id)) byPlayer.set(m.player2_id, []);
                byPlayer.get(m.player1_id).push(m);
                byPlayer.get(m.player2_id).push(m);
            }
            // matches are sorted desc already
            const scored = [];
            for (const [pid, ms] of byPlayer) {
                const last5 = ms.slice(0, 5);
                if (!last5.length) continue;
                let pts = 0;
                for (const m of last5) {
                    const r = resultOf(m, pid);
                    if (r) pts += pointsForResult(r);
                }
                scored.push({ id: pid, points: pts, played: last5.length });
            }
            scored.sort((a, b) => b.points - a.points || b.played - a.played);
            return scored[0] ?? null;
        }

        function computeStreak(matchesDescForPlayer, playerId) {
            // matches in date desc order. Walk and count consecutive same result.
            let kind = null, count = 0;
            for (const m of matchesDescForPlayer) {
                const r = resultOf(m, playerId);
                if (!r) continue;
                if (kind === null) { kind = r; count = 1; }
                else if (r === kind) count++;
                else break;
            }
            return kind ? `${kind}${count}` : null;
        }

        function computeClutch(allFinished, playerId) {
            // Find each tournament's "last match" for this player (highest date),
            // then compute win rate over those vs overall.
            const involvedAll = allFinished.filter(m => m.player1_id === playerId || m.player2_id === playerId);
            if (!involvedAll.length) return { clutchPct: null, overallPct: null, n: 0 };
            const byTour = new Map();
            for (const m of involvedAll) {
                const k = m.tournament_id;
                if (k == null) continue;
                const cur = byTour.get(k);
                if (!cur || new Date(m.date) > new Date(cur.date)) byTour.set(k, m);
            }
            const clutchSet = [...byTour.values()];
            const w = (set) => set.filter(m => resultOf(m, playerId) === 'W').length;
            return {
                clutchPct: clutchSet.length ? Math.round(100 * w(clutchSet) / clutchSet.length) : null,
                overallPct: Math.round(100 * w(involvedAll) / involvedAll.length),
                n: clutchSet.length,
            };
        }

        function computeRates(matchesForPlayer, playerId) {
            let cs = 0, n = 0, hi35 = 0, hi45 = 0, btts = 0;
            for (const m of matchesForPlayer) {
                if (m.score1 == null || m.score2 == null) continue;
                n++;
                const own = ownGoals(m, playerId), opp = oppGoals(m, playerId);
                if (opp === 0) cs++;
                const total = m.score1 + m.score2;
                if (total > 3.5) hi35++;
                if (total > 4.5) hi45++;
                if (m.score1 > 0 && m.score2 > 0) btts++;
            }
            const pct = (x) => n ? Math.round(100 * x / n) : 0;
            return { n, cleanSheetPct: pct(cs), over35Pct: pct(hi35), over45Pct: pct(hi45), bttsPct: pct(btts) };
        }

        function buildScoreDistribution(matches, playerId) {
            // Returns {labels: ['1-0','2-1',...], wins: [...], draws: [...], losses: [...]}
            const buckets = new Map();
            for (const m of matches) {
                const own = ownGoals(m, playerId), opp = oppGoals(m, playerId);
                if (own == null || opp == null) continue;
                const key = `${own}-${opp}`;
                if (!buckets.has(key)) buckets.set(key, { wins: 0, draws: 0, losses: 0 });
                const r = resultOf(m, playerId);
                if (r === 'W') buckets.get(key).wins++;
                else if (r === 'D') buckets.get(key).draws++;
                else if (r === 'L') buckets.get(key).losses++;
            }
            const sorted = [...buckets.entries()].sort((a, b) => {
                const [a1, a2] = a[0].split('-').map(Number);
                const [b1, b2] = b[0].split('-').map(Number);
                return (a1 + a2) - (b1 + b2) || a1 - b1;
            });
            return {
                labels: sorted.map(e => e[0]),
                wins: sorted.map(e => e[1].wins),
                draws: sorted.map(e => e[1].draws),
                losses: sorted.map(e => e[1].losses),
            };
        }

        function leagueTableForPlayers(playerIds, finishedMatches) {
            const set = new Set(playerIds);
            const rows = new Map();
            for (const id of playerIds) rows.set(id, { id, p:0, w:0, d:0, l:0, gf:0, ga:0 });
            for (const m of finishedMatches) {
                if (!set.has(m.player1_id) || !set.has(m.player2_id)) continue;
                if (m.score1 == null || m.score2 == null) continue;
                const a = rows.get(m.player1_id), b = rows.get(m.player2_id);
                a.p++; b.p++;
                a.gf += m.score1; a.ga += m.score2;
                b.gf += m.score2; b.ga += m.score1;
                if (m.score1 > m.score2) { a.w++; b.l++; }
                else if (m.score1 < m.score2) { a.l++; b.w++; }
                else { a.d++; b.d++; }
            }
            const out = [...rows.values()].map(r => ({ ...r, gd: r.gf - r.ga, pts: r.w * 3 + r.d }));
            out.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
            return out;
        }

        // ---------- ticker ----------
        async function renderTicker() {
            const wrap = document.getElementById('ticker-wrap');
            const track = document.getElementById('ticker-track');
            const { data, error } = await sb.from('matches').select(MATCH_SELECT)
                .eq('status', STATUS.FINISHED)
                .order('date', { ascending: false })
                .limit(20);
            if (error || !data?.length) { wrap.style.display = 'none'; return; }
            const renderItem = (m) => {
                const p1 = state.playersById.get(m.player1_id);
                const p2 = state.playersById.get(m.player2_id);
                const n1 = p1 ? `<a class="player-link" href="#/player/${encodeURIComponent(p1.nickname)}">${esc(p1.nickname)}</a>` : `#${m.player1_id}`;
                const n2 = p2 ? `<a class="player-link" href="#/player/${encodeURIComponent(p2.nickname)}">${esc(p2.nickname)}</a>` : `#${m.player2_id}`;
                return `<span class="ticker-item">
                    <span>${n1} <span class="score">${m.score1}–${m.score2}</span> ${n2}</span>
                    <span class="meta">${fmtAgo(m.date)}</span>
                </span>`;
            };
            const items = data.map(renderItem).join('');
            // Duplicate so the marquee loops seamlessly
            track.innerHTML = items + items;
            wrap.style.display = 'block';
        }

        // ---------- HOME ----------
        async function renderHome(app) {
            const [allFinished, live, upcoming] = await Promise.all([
                fetchAllFinished(),
                fetchLive(),
                fetchUpcoming(),
            ]);
            const predMap = await fetchPredictionsForMatchIds(upcoming.map(m => m.id));
            const totalMatchesAll = await sb.from('matches').select('id', { head: true, count: 'exact' });

            // Hottest player
            const hottest = buildHottestPlayer(allFinished);
            const hottestLabel = hottest && state.playersById.get(hottest.id)
                ? `${playerLink(hottest.id)} <span class="muted">${hottest.points} pts</span>`
                : '<span class="muted">—</span>';

            // Predictions accuracy 7d
            const since = new Date(Date.now() - 7 * 86400 * 1000).toISOString();
            let predAcc = null;
            try {
                const { data: preds, error } = await sb.from('predictions').select('winner_correct')
                    .gte('evaluated_at', since).not('winner_correct', 'is', null);
                if (!error) {
                    if (preds?.length) {
                        const c = preds.filter(p => p.winner_correct).length;
                        predAcc = { pct: Math.round(100 * c / preds.length), n: preds.length };
                    } else predAcc = { pct: null, n: 0 };
                }
            } catch {}

            // Top performers last 7d + streak
            const since7 = Date.now() - 7 * 86400 * 1000;
            const week = allFinished.filter(m => new Date(m.date).getTime() >= since7);
            const tally = new Map();
            for (const m of week) {
                const inc = (id) => tally.set(id, tally.get(id) || { id, w:0, d:0, l:0, gp:0 });
                inc(m.player1_id); inc(m.player2_id);
                const a = tally.get(m.player1_id); const b = tally.get(m.player2_id);
                a.gp++; b.gp++;
                if (m.score1 > m.score2) { a.w++; b.l++; }
                else if (m.score1 < m.score2) { a.l++; b.w++; }
                else { a.d++; b.d++; }
            }
            const weekTop = [...tally.values()].sort((a, b) => b.w - a.w || b.gp - a.gp).slice(0, 5);
            const streakFor = (pid) => {
                const player_matches = allFinished.filter(m => m.player1_id === pid || m.player2_id === pid);
                return computeStreak(player_matches, pid);
            };

            // Recent results grouped by tournament (last 10 tournaments)
            const tourBuckets = new Map();
            for (const m of allFinished) {
                if (m.tournament_id == null) continue;
                if (!tourBuckets.has(m.tournament_id)) tourBuckets.set(m.tournament_id, []);
                tourBuckets.get(m.tournament_id).push(m);
            }
            const tourEntries = [...tourBuckets.entries()].map(([tid, ms]) => ({
                tid,
                matches: ms,
                latest: Math.max(...ms.map(m => new Date(m.date).getTime())),
            })).sort((a, b) => b.latest - a.latest).slice(0, 10);
            const tourMeta = await fetchTournamentsByIds(tourEntries.map(e => e.tid));

            app.innerHTML = `
                <section>
                    <div class="stats-grid">
                        ${statCard('Total Matches', `<span class="accent">${totalMatchesAll.count ?? 0}</span>`)}
                        ${statCard('Tracked Players', state.players.length)}
                        ${statCard('Prediction Acc · 7d',
                            predAcc?.n
                                ? `<span class="accent">${predAcc.pct}%</span> <span class="muted" style="font-size:13px;font-weight:400">(${predAcc.n})</span>`
                                : '<span class="muted">—</span>')}
                        ${statCard('Hottest Player', hottestLabel)}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Live now</h2>
                    <div class="match-grid">
                        ${live.length ? live.map(m => matchCard(m)).join('') : '<div class="glass empty" style="grid-column:1/-1">No live matches.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Upcoming · with predictions</h2>
                    <div class="match-grid">
                        ${upcoming.length ? upcoming.map(m => matchCard(m, predMap.get(m.id))).join('') : '<div class="glass empty" style="grid-column:1/-1">No upcoming matches.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Recent results · grouped by tournament <span class="right">last 10 tournaments</span></h2>
                    <div style="display:flex;flex-direction:column;gap:10px">
                        ${tourEntries.length ? tourEntries.map(e => tournamentBlock(e.tid, e.matches, tourMeta.get(e.tid))).join('') : '<div class="glass empty">No finished tournaments.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Top performers · last 7 days</h2>
                    <div class="glass table-wrap">
                        <table class="data">
                            <thead><tr><th class="num">#</th><th>Player</th><th class="num">Played</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th>Streak</th></tr></thead>
                            <tbody>
                                ${weekTop.length ? weekTop.map((r, i) => {
                                    const s = streakFor(r.id);
                                    const cls = s ? `streak-${s[0]}` : '';
                                    const sBadge = s ? `<span class="badge ${cls}">${s}</span>` : '<span class="dim">—</span>';
                                    return `<tr>
                                        <td class="num muted">${i+1}</td>
                                        <td>${playerLink(r.id)}</td>
                                        <td class="num">${r.gp}</td>
                                        <td class="num accent">${r.w}</td>
                                        <td class="num">${r.d}</td>
                                        <td class="num">${r.l}</td>
                                        <td>${sBadge}</td>
                                    </tr>`;
                                }).join('') : '<tr><td colspan="7" class="empty">No matches in the last 7 days.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </section>
            `;

            // Wire up tournament collapsibles
            app.querySelectorAll('.tournament-block .head').forEach(h => {
                h.addEventListener('click', () => h.parentElement.classList.toggle('open'));
            });
        }

        function statCard(label, value, delta = '') {
            return `<div class="glass stat-card">
                <div class="label">${esc(label)}</div>
                <div class="value">${value}</div>
                ${delta ? `<div class="delta">${delta}</div>` : ''}
            </div>`;
        }

        function statusInfo(s) {
            if (s === STATUS.UPCOMING) return { cls: 'upcoming', label: 'Upcoming' };
            if (s === STATUS.LIVE) return { cls: 'live', label: 'Live' };
            if (s === STATUS.FINISHED) return { cls: 'finished', label: 'Finished' };
            return { cls: '', label: '—' };
        }

        function matchCard(m, prediction = null) {
            const st = statusInfo(m.status);
            const scoreCls = `score ${st.cls}`;
            const scoreText = m.status === STATUS.UPCOMING
                ? 'vs'
                : `${m.score1 ?? '–'} : ${m.score2 ?? '–'}`;
            let predHTML = '';
            if (prediction && m.status === STATUS.UPCOMING) {
                const winner = prediction.predicted_winner_id
                    ? playerLink(prediction.predicted_winner_id)
                    : '<span class="dim">draw</span>';
                predHTML = `<div class="pred">
                    <span>Predicted: ${winner} ${prediction.predicted_score1 ?? '?'}–${prediction.predicted_score2 ?? '?'}</span>
                    <span class="conf">${Number(prediction.confidence ?? 0).toFixed(0)}% conf</span>
                </div>`;
            }
            return `<div class="glass match-card">
                <div class="match-row">
                    <div class="player">
                        <div class="nick">${playerLink(m.player1_id)}</div>
                        <div class="team">${esc(m.team1 ?? '')}</div>
                    </div>
                    <div class="${scoreCls}">${scoreText}</div>
                    <div class="player right">
                        <div class="nick">${playerLink(m.player2_id)}</div>
                        <div class="team">${esc(m.team2 ?? '')}</div>
                    </div>
                </div>
                <div class="meta">
                    <span class="badge ${st.cls}">${st.label}</span>
                    <span>${fmtTime(m.date)}</span>
                </div>
                ${predHTML}
            </div>`;
        }

        function tournamentBlock(tid, matches, meta) {
            const ms = [...matches].sort((a, b) => new Date(a.date) - new Date(b.date));
            const playersInvolved = new Set();
            ms.forEach(m => { playersInvolved.add(m.player1_id); playersInvolved.add(m.player2_id); });
            const table = leagueTableForPlayers([...playersInvolved], ms);
            const rows = table.map((r, i) => `<tr>
                <td class="num muted">${i+1}</td>
                <td>${playerLink(r.id)}</td>
                <td class="num">${r.p}</td>
                <td class="num">${r.w}</td>
                <td class="num">${r.d}</td>
                <td class="num">${r.l}</td>
                <td class="num">${r.gf}</td>
                <td class="num">${r.ga}</td>
                <td class="num">${r.gd >= 0 ? '+' : ''}${r.gd}</td>
                <td class="num accent">${r.pts}</td>
            </tr>`).join('');
            const matchRows = ms.map(m => `<tr>
                <td>${fmtTime(m.date)}</td>
                <td>${playerLink(m.player1_id)}</td>
                <td class="num">${m.score1 ?? '–'} : ${m.score2 ?? '–'}</td>
                <td>${playerLink(m.player2_id)}</td>
            </tr>`).join('');
            return `<div class="glass tournament-block">
                <div class="head">
                    <div class="tname">${esc(meta?.name ?? '#' + tid)}</div>
                    <div class="tdate">${meta?.date ? fmtDate(meta.date) : fmtDate(ms[0].date)}</div>
                    <div class="chev">›</div>
                </div>
                <div class="body">
                    <table class="data">
                        <thead><tr><th class="num">#</th><th>Player</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <div style="border-top:1px solid var(--line-soft)"></div>
                    <table class="data">
                        <thead><tr><th>Time</th><th>Player 1</th><th class="num">Score</th><th>Player 2</th></tr></thead>

                    </table>
                </div>
            </div>`;
        }

        // ---------- PLAYER ----------
        function findPlayerByNickname(nick) {
            return state.playersByName.get(nick.toLowerCase()) ?? null;
        }

        async function renderPlayer(app, nickname) {
            const player = findPlayerByNickname(nickname);
            if (!player) {
                app.innerHTML = `<section class="glass empty">No tracked player named "${esc(nickname)}".</section>`;
                return;
            }
            const [allFinished, ps, h2hRows, predAcc] = await Promise.all([
                fetchAllFinished(),
                sb.from('player_stats').select('*').eq('player_id', player.id).limit(1).then(r => r.data?.[0] ?? null),
                sb.from('h2h_stats').select('*').or(`player1_id.eq.${player.id},player2_id.eq.${player.id}`).then(r => r.data ?? []),
                fetchPlayerPredictionAccuracy(player.id),
            ]);

            const playerMatches = allFinished.filter(m =>
                m.player1_id === player.id || m.player2_id === player.id
            );
            // recent form 30
            const last30Results = playerMatches.slice(0, 30).map(m => resultOf(m, player.id)).filter(Boolean).reverse();
            const streak = computeStreak(playerMatches, player.id);
            const clutch = computeClutch(allFinished, player.id);
            const rates = computeRates(playerMatches, player.id);
            const winRate = ps?.matches_played ? Math.round(100 * ps.wins / ps.matches_played) : 0;
            const dist = buildScoreDistribution(playerMatches, player.id);
            const member = state.memberByPlayerId.get(player.id);
            const groupTag = member ? `<span class="group-tag">${esc(state.groupsById.get(member.group_id)?.name ?? '?')}</span>` : '';
            const roleTag = member && member.role !== 'core' ? `<span class="role-tag">${esc(member.role)}</span>` : '';

            // Best/worst opponents — with last 5 result strip vs each
            const opponents = h2hRows.map(h => {
                const isP1 = h.player1_id === player.id;
                const oppId = isP1 ? h.player2_id : h.player1_id;
                return {
                    oppId,
                    matches_played: h.matches_played,
                    wins: isP1 ? h.wins_p1 : h.wins_p2,
                    losses: isP1 ? h.wins_p2 : h.wins_p1,
                    draws: h.draws,
                    avg_gf: Number(isP1 ? h.avg_gf_p1 : h.avg_gf_p2),
                    avg_ga: Number(isP1 ? h.avg_gf_p2 : h.avg_gf_p1),
                };
            });
            const last5VsOpp = (oppId) => {
                const ms = playerMatches.filter(m => m.player1_id === oppId || m.player2_id === oppId).slice(0, 5);
                return ms.map(m => resultOf(m, player.id)).filter(Boolean).reverse();
            };
            const best = [...opponents].filter(o => o.matches_played >= 1)
                .sort((a, b) => (b.wins/b.matches_played) - (a.wins/a.matches_played) || b.matches_played - a.matches_played).slice(0, 3);
            const worst = [...opponents].filter(o => o.matches_played >= 1)
                .sort((a, b) => (b.losses/b.matches_played) - (a.losses/a.matches_played) || b.matches_played - a.matches_played).slice(0, 3);

            const predLabel = predAcc == null
                ? '<span class="muted">—</span>'
                : predAcc.n === 0 ? '<span class="muted">none graded</span>'
                : `<span class="accent">${predAcc.pct}%</span> <span class="muted" style="font-size:12px">(${predAcc.n})</span>`;
            const streakBadge = streak ? `<span class="badge streak-${streak[0]}">${streak}</span>` : '<span class="muted">—</span>';
            const clutchVal = clutch.clutchPct == null
                ? '—'
                : `<span class="accent">${clutch.clutchPct}%</span> <span class="muted" style="font-size:12px">(${clutch.n})</span>`;

            app.innerHTML = `
                <section class="glass player-header">
                    <div>
                        <div class="name-row">
                            <div class="name">${esc(player.nickname)}</div>
                            ${groupTag}
                            ${roleTag}
                            <div style="font-size:13px;color:var(--muted)">Current streak: ${streakBadge}</div>
                        </div>
                        <div class="quick">
                            <div class="qs-item"><div class="v"><span class="accent">${ps?.wins ?? 0}</span> · ${ps?.draws ?? 0} · ${ps?.losses ?? 0}</div><div class="l">W · D · L</div></div>
                            <div class="qs-item"><div class="v">${winRate}%</div><div class="l">win rate</div></div>
                            <div class="qs-item"><div class="v">${Number(ps?.avg_gf ?? 0).toFixed(2)}</div><div class="l">avg goals for</div></div>
                            <div class="qs-item"><div class="v">${Number(ps?.avg_ga ?? 0).toFixed(2)}</div><div class="l">avg goals against</div></div>
                            <div class="qs-item"><div class="v">${rates.cleanSheetPct}%</div><div class="l">clean sheet</div></div>
                            <div class="qs-item"><div class="v">${rates.over35Pct}%</div><div class="l">games &gt;3.5</div></div>
                            <div class="qs-item"><div class="v">${rates.over45Pct}%</div><div class="l">games &gt;4.5</div></div>
                            <div class="qs-item"><div class="v">${clutchVal}</div><div class="l">clutch (final)</div></div>
                            <div class="qs-item"><div class="v">${predLabel}</div><div class="l">predictions acc</div></div>
                            <div class="qs-item"><div class="v">${ps?.matches_played ?? 0}</div><div class="l">matches played</div></div>
                        </div>
                    </div>
                    <div>
                        <a class="btn primary" href="#/compare/${encodeURIComponent(player.nickname)}">Compare</a>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Recent form · last 30</h2>
                    <div class="glass" style="padding:22px;">
                        ${last30Results.length
                            ? `<div class="form-strip">${last30Results.map(r => `<div class="form-dot ${r}">${r}</div>`).join('')}</div>`
                            : '<div class="muted">No finished matches.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Goal trend · last 20 finished</h2>
                    <div class="glass chart-wrap">
                        <canvas id="goal-chart"></canvas>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Score distribution</h2>
                    <div class="glass chart-wrap tall">
                        <canvas id="dist-chart"></canvas>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Best opponents</h2>
                    <div class="three-col">
                        ${best.length ? best.map(o => oppCardHTML(o, 'best', last5VsOpp(o.oppId))).join('')
                            : '<div class="glass empty" style="grid-column:1/-1">No head-to-head data.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Worst opponents</h2>
                    <div class="three-col">
                        ${worst.length ? worst.map(o => oppCardHTML(o, 'worst', last5VsOpp(o.oppId))).join('')
                            : '<div class="glass empty" style="grid-column:1/-1">No head-to-head data.</div>'}
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Recent matches</h2>
                    <div class="glass table-wrap">
                        <table class="data" id="matches-table">
                            <thead><tr><th>Date</th><th>Result</th><th>Opponent</th><th>Score</th></tr></thead>
                            <tbody>${playerMatches.slice(0, 10).map(m => matchRowHTML(m, player.id)).join('')}</tbody>
                        </table>
                        <div style="padding:12px 18px;border-top:1px solid var(--line-soft);text-align:center">
                            <button class="btn small-btn" id="load-more" data-n="10" data-total="${playerMatches.length}">Load more</button>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="section-title">Head to head</h2>
                    <div class="glass" style="padding:22px;">
                        <div class="controls">
                            <input id="h2h-input" class="search-input" style="max-width:240px" placeholder="Opponent nickname" autocomplete="off" spellcheck="false">
                            <button class="btn" id="h2h-go">Search</button>
                        </div>
                        <div id="h2h-output"><div class="empty" style="padding:20px">Enter an opponent nickname.</div></div>
                    </div>
                </section>
            `;

            // Goal trend chart
            const trend = playerMatches.slice(0, 20).reverse();
            const tCtx = document.getElementById('goal-chart').getContext('2d');
            state.charts.push(new Chart(tCtx, {
                type: 'line',
                data: {
                    labels: trend.map(m => fmtTime(m.date)),
                    datasets: [{
                        label: 'Goals scored',
                        data: trend.map(m => ownGoals(m, player.id) ?? 0),
                        borderColor: '#00ff87',
                        backgroundColor: 'rgba(0,255,135,0.08)',
                        tension: 0.3, pointRadius: 3, pointHoverRadius: 6,
                        pointBackgroundColor: '#00ff87', fill: true, borderWidth: 2,
                    }],
                },
                options: chartOpts(),
            }));

            // Distribution chart (stacked)
            const dCtx = document.getElementById('dist-chart').getContext('2d');
            state.charts.push(new Chart(dCtx, {
                type: 'bar',
                data: {
                    labels: dist.labels,
                    datasets: [
                        { label: 'Wins',   data: dist.wins,   backgroundColor: 'rgba(0,255,135,0.7)' },
                        { label: 'Draws',  data: dist.draws,  backgroundColor: 'rgba(255,255,255,0.25)' },
                        { label: 'Losses', data: dist.losses, backgroundColor: 'rgba(255,91,91,0.7)' },
                    ],
                },
                options: { ...chartOpts(true), scales: { x: chartGrid(), y: { ...chartGrid(), beginAtZero: true, ticks: { stepSize: 1, color: '#666' }, stacked: true } } },
            }));
            // Re-config: stacked needs both axes stacked
            const distChart = state.charts[state.charts.length - 1];
            distChart.options.scales.x.stacked = true;
            distChart.update();

            // Load more
            const loadMoreBtn = document.getElementById('load-more');
            const tbody = document.querySelector('#matches-table tbody');
            let loaded = 10;
            loadMoreBtn.addEventListener('click', () => {
                const next = playerMatches.slice(loaded, loaded + 10);
                if (!next.length) { loadMoreBtn.disabled = true; loadMoreBtn.textContent = 'No more'; return; }
                tbody.insertAdjacentHTML('beforeend', next.map(m => matchRowHTML(m, player.id)).join(''));
                loaded += next.length;
                if (loaded >= playerMatches.length) { loadMoreBtn.disabled = true; loadMoreBtn.textContent = 'No more'; }
            });

            // H2H search
            const h2hInput = document.getElementById('h2h-input');
            const h2hGo = document.getElementById('h2h-go');
            const h2hOut = document.getElementById('h2h-output');
            const doH2H = async () => {
                const opp = findPlayerByNickname(h2hInput.value.trim());
                if (!opp) { h2hOut.innerHTML = '<div class="empty" style="padding:20px">Player not found.</div>'; return; }
                if (opp.id === player.id) { h2hOut.innerHTML = '<div class="empty" style="padding:20px">Pick a different player.</div>'; return; }
                const lo = Math.min(player.id, opp.id);
                const hi = Math.max(player.id, opp.id);
                const { data } = await sb.from('h2h_stats').select('*').eq('player1_id', lo).eq('player2_id', hi).limit(1);
                if (!data?.length) {
                    h2hOut.innerHTML = `<div class="empty" style="padding:20px">${esc(player.nickname)} and ${esc(opp.nickname)} have never played.</div>`;
                    return;
                }
                const h = data[0];
                const aIsLo = player.id === lo;
                const aWins = aIsLo ? h.wins_p1 : h.wins_p2;
                const bWins = aIsLo ? h.wins_p2 : h.wins_p1;
                const aGF = Number(aIsLo ? h.avg_gf_p1 : h.avg_gf_p2);
                const bGF = Number(aIsLo ? h.avg_gf_p2 : h.avg_gf_p1);
                // BTTS / Over X.5 across raw matches between this pair
                const pairMatches = allFinished.filter(m =>
                    (m.player1_id === player.id && m.player2_id === opp.id) ||
                    (m.player1_id === opp.id && m.player2_id === player.id)
                );
                const r = computeRates(pairMatches, player.id);
                const wPct = h.matches_played ? Math.round(100 * aWins / h.matches_played) : 0;
                const lPct = h.matches_played ? Math.round(100 * bWins / h.matches_played) : 0;
                const dPct = h.matches_played ? Math.round(100 * h.draws / h.matches_played) : 0;
                h2hOut.innerHTML = `
                    <div class="glass" style="padding:0">
                        <div class="h2h-result">
                            <div class="col">
                                <div class="nick">${playerLink(player.id)}</div>
                                <div class="row"><div class="stat-big">${aWins}</div><div class="label">wins (${wPct}%)</div></div>
                                <div class="row"><div class="stat-mid">${aGF.toFixed(2)}</div><div class="label">avg goals</div></div>
                            </div>
                            <div class="col">
                                <div class="nick muted" style="font-size:11px;letter-spacing:2px;text-transform:uppercase">vs</div>
                                <div class="row"><div class="stat-big">${h.matches_played}</div><div class="label">matches</div></div>
                                <div class="row"><div class="stat-mid">${h.draws} <span class="muted" style="font-size:13px">(${dPct}%)</span></div><div class="label">draws</div></div>
                            </div>
                            <div class="col">
                                <div class="nick">${playerLink(opp.id)}</div>
                                <div class="row"><div class="stat-big">${bWins}</div><div class="label">wins (${lPct}%)</div></div>
                                <div class="row"><div class="stat-mid">${bGF.toFixed(2)}</div><div class="label">avg goals</div></div>
                            </div>
                        </div>
                        <div class="h2h-extras">
                            <div class="ext"><div class="v">${r.bttsPct}%</div><div class="l">BTTS</div></div>
                            <div class="ext"><div class="v">${r.over35Pct}%</div><div class="l">Over 2.5</div></div>
                            <div class="ext"><div class="v">${r.over45Pct}%</div><div class="l">Over 3.5</div></div>
                            <div class="ext"><div class="v">${Math.round(100 * pairMatches.filter(m => (m.score1+m.score2) > 4.5).length / Math.max(1, pairMatches.length))}%</div><div class="l">Over 4.5</div></div>
                        </div>
                    </div>
                `;
            };
            h2hGo.addEventListener('click', doH2H);
            h2hInput.addEventListener('keydown', e => { if (e.key === 'Enter') doH2H(); });
        }

        function chartGrid() {
            return { ticks: { color: '#666', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { color: 'rgba(255,255,255,0.04)' } };
        }
        function chartOpts(showLegend = false) {
            return {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: showLegend, labels: { color: '#888', font: { family: 'Inter' } } },
                    tooltip: { backgroundColor: 'rgba(15,15,17,0.95)', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 },
                },
                scales: { x: chartGrid(), y: { ...chartGrid(), beginAtZero: true, ticks: { color: '#666', stepSize: 1 } } },
            };
        }

        function oppCardHTML(o, kind, last5) {
            const wr = o.matches_played ? Math.round(100 * o.wins / o.matches_played) : 0;
            const lr = o.matches_played ? Math.round(100 * o.losses / o.matches_played) : 0;
            return `<div class="glass opp-card">
                <div class="nick">${playerLink(o.oppId)}</div>
                <div class="sub">${kind} · ${o.matches_played} matches</div>
                <div class="row">
                    <div><div class="v accent">${kind === 'best' ? wr : lr}%</div><div class="l">${kind === 'best' ? 'win rate' : 'loss rate'}</div></div>
                    <div><div class="v">${o.avg_gf.toFixed(1)}</div><div class="l">avg gf</div></div>
                    <div><div class="v">${o.avg_ga.toFixed(1)}</div><div class="l">avg ga</div></div>
                </div>
                <div class="last5">
                    <span>last 5:</span>
                    <div class="form-strip compact">
                        ${last5.length ? last5.map(r => `<div class="form-dot ${r}">${r}</div>`).join('') : '<span class="muted">none</span>'}
                    </div>
                </div>
            </div>`;
        }

        function matchRowHTML(m, playerId) {
            const r = resultOf(m, playerId);
            const isP1 = m.player1_id === playerId;
            const oppId = isP1 ? m.player2_id : m.player1_id;
            const own = isP1 ? m.score1 : m.score2;
            const opp = isP1 ? m.score2 : m.score1;
            const badge = r ? `<span class="badge ${r}">${r}</span>` : '<span class="dim">—</span>';
            return `<tr>
                <td>${fmtTime(m.date)}</td>
                <td>${badge}</td>
                <td>${playerLink(oppId)}</td>
                <td class="num">${own ?? '–'} : ${opp ?? '–'}</td>
            </tr>`;
        }

        async function fetchPlayerPredictionAccuracy(playerId) {
            try {
                const { data, error } = await sb.from('predictions')
                    .select('winner_correct, match:matches!predictions_match_id_fkey(player1_id, player2_id)')
                    .not('winner_correct', 'is', null);
                if (error) return null;
                const involved = (data ?? []).filter(p => p.match
                    && (p.match.player1_id === playerId || p.match.player2_id === playerId));
                if (!involved.length) return { pct: null, n: 0 };
                const c = involved.filter(p => p.winner_correct).length;
                return { pct: Math.round(100 * c / involved.length), n: involved.length };
            } catch (e) { return null; }
        }

        // ---------- GROUPS ----------
        async function renderGroups(app) {
            const allFinished = await fetchAllFinished();
            // Show 7 groups (skip Float Pool)
            const groups = state.groups.filter(g => g.id !== FLOAT_GROUP_ID);
            app.innerHTML = `
                <section>
                    <h2 class="section-title">Groups</h2>
                    <div class="groups-grid">
                        ${groups.map(g => groupCardHTML(g, allFinished)).join('')}

        function groupCoreIds(groupId) {
            return state.members.filter(m => m.group_id === groupId && m.role === 'core').map(m => m.player_id);
        }
        function groupAllIds(groupId) {
            return state.members.filter(m => m.group_id === groupId).map(m => m.player_id);
        }

        function groupCardHTML(g, allFinished) {
            const coreIds = groupCoreIds(g.id);
            const subIds = state.members.filter(m => m.group_id === g.id && m.role === 'sub').map(m => m.player_id);
            const table = leagueTableForPlayers(coreIds, allFinished);
            return `<a class="glass group-card" href="#/group/${g.id}">
                <div class="ghead">
                    <div class="gname">${esc(g.name)}</div>
